<style>
:root{color-scheme:dark;--bg:#1C1C1C;--ink:#fff;--soft:#E0D5C0;--muted:#8d8d8d;--line:rgba(207,174,112,.18);--strong:rgba(207,174,112,.36);--gold:#CFAE70;--highlight:#ECB748;--sans:"Figtree","Helvetica Neue",Arial,sans-serif;--serif:"Newsreader",Georgia,serif;--vvw:100vw;--vvh:100dvh;--vvx:0px;--vvy:0px}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;max-width:100%;overflow-x:hidden;background:var(--bg);color:var(--ink);font:15px/1.4 var(--sans);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}button{cursor:pointer;touch-action:manipulation}.hidden{display:none!important}
.wrap{width:min(720px,100%);margin:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(28px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.kicker{display:flex;align-items:center;gap:8px;color:var(--gold);font-size:11px;font-weight:700;letter-spacing:.17em;text-transform:uppercase}.star{width:14px;height:14px;fill:var(--gold)}

.watch-sticky .help-how{margin:6px 0 0}
.status{padding:18px;border:1px solid var(--line);border-radius:15px;background:#000;color:var(--soft)}
.watch-sticky{position:sticky;top:max(0px,env(safe-area-inset-top,0px));z-index:40;margin:0 0 14px;padding:8px 0 10px;background:rgba(28,28,28,.96);border-bottom:1px solid var(--line)}
.home-section{margin:0 0 26px}.home-section>h2{margin:0 0 10px;color:var(--gold);font:700 12px/1.2 var(--sans);letter-spacing:.16em;text-transform:uppercase}
.play-groups{display:grid;gap:2px}.play-group{margin:0 0 18px}.play-group h3{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 9px;color:var(--soft);font:600 22px/1.1 var(--serif)}
.play-group h3 span{color:var(--muted);font:700 11px/1 var(--sans)}
.picks{display:grid;gap:10px;margin:0 0 8px}
.picks button{display:block;width:100%;min-height:72px;border:1px solid var(--strong);border-radius:16px;padding:14px 16px;background:#000;color:var(--soft);text-align:left;font-weight:800}
.picks button b{display:block;color:var(--ink);font:600 28px/1 var(--serif)}
.picks button small{display:block;margin-top:6px;color:var(--gold);font-size:14px;font-weight:700}
.picks button:active{border-color:var(--highlight);background:rgba(207,174,112,.16)}
.back{display:inline-flex;align-items:center;min-height:44px;margin:0 0 8px;padding:0;border:0;background:none;color:var(--gold);font-weight:800}
.watching{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:9px;margin:0}.watching span{color:var(--gold);font-size:12px;font-weight:800}.watching select{min-height:46px;width:100%;border:1px solid var(--strong);border-radius:11px;padding:8px 10px;background:#000;color:var(--soft);font-weight:700}
.study-switch{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 0}.study-switch button{min-height:44px;min-width:44px;padding:8px 12px;border:1px solid var(--strong);border-radius:999px;background:#000;color:var(--muted);font-weight:800}.study-switch button.on{border-color:var(--highlight);background:rgba(207,174,112,.16);color:var(--ink)}
.play-number{margin:0 0 8px;color:var(--gold);font:600 42px/1 var(--serif);letter-spacing:.02em;text-align:center}
.play-number small{display:block;margin-top:4px;color:var(--soft);font:600 16px/1.2 var(--sans);letter-spacing:0}
.play-name{display:none;margin:0 112px 8px 10px;color:var(--soft);font:600 26px/1.1 var(--serif);letter-spacing:.01em}
.play-name small{display:block;margin:0 0 3px;color:var(--gold);font:700 11px/1.2 var(--sans);letter-spacing:.16em;text-transform:uppercase}
.field-wrap{overflow:hidden;border:1px solid var(--strong);border-radius:16px;background:#000}.field{display:block;width:100%;height:auto}.field text{font-family:var(--sans);font-weight:700}.field .yard{stroke:rgba(255,255,255,.2);stroke-width:1}
.play-shell{position:relative}.done{display:none}
.tools{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:8px;margin:10px 0 8px}.tools button{min-height:54px;border:0;border-radius:12px;background:var(--gold);color:#1C1C1C;font-weight:800;font-size:17px}.tools .ghost{border:1px solid var(--strong);background:transparent;color:var(--soft)}.tools .ghost.on{border-color:var(--highlight);background:rgba(207,174,112,.16);color:var(--ink)}.tools.one{grid-template-columns:1fr}
.speed{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 8px}.speed button{min-height:48px;border:1px solid var(--strong);border-radius:12px;background:#000;color:var(--muted);font-weight:800;font-size:15px}.speed button.on{border-color:var(--highlight);background:rgba(207,174,112,.16);color:var(--ink)}

body.immersive{overflow:hidden;background:#000}

body.immersive .play-name{display:block}
body.immersive .play-number{display:none}
body.immersive .field-wrap{display:grid;flex:1;min-height:0;place-items:center;border:0;border-radius:0}
body.immersive .field{width:min(calc(var(--vvw) - 8px),calc((var(--vvh) - 176px)*1.2));height:auto;max-width:calc(var(--vvw) - 8px);max-height:calc(var(--vvh) - 176px);aspect-ratio:480/400}
body.immersive .tools{grid-template-columns:1fr;margin:8px auto;width:min(440px,100%)}
body.immersive .tools button{display:none}
body.immersive .tools #play{display:block}
body.immersive #defenseTools{display:none}
body.immersive .speed{width:min(440px,100%);margin:0 auto 6px}
body.immersive .scrub{width:min(560px,100%);margin:auto}
@media(orientation:landscape) and (max-height:780px){
  body.immersive .play-name{font-size:22px;margin-bottom:4px}
  body.immersive .tools #play{min-height:48px;font-size:16px}
  body.immersive .field{width:min(calc(var(--vvw) - 8px),calc((var(--vvh) - 156px)*1.2));max-height:calc(var(--vvh) - 156px)}
}
@media(max-width:420px){h1{font-size:28px}.wrap{padding-left:12px;padding-right:12px}.play-number{font-size:36px}.play-name{font-size:22px}.tools{grid-template-columns:1fr 1fr}.tools #play{grid-column:1/-1}}
</style>

<body>
<main class="wrap">
  <div id="intro">
    <div class="kicker"><svg class="star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.2 14.7 8.7 21.8 8.7 16.1 12.8 18.3 19.8 12 15.8 5.7 19.8 7.9 12.8 2.2 8.7 9.3 8.7 Z"/></svg>Vanderbilt · Fall ’26</div>
    <h1>Commodores Plays</h1>
    <p class="sub">Pick who you’re watching as, then tap an offense play or Base zone.</p>
    <a class="help-how" href="parent-guide.html">Help / How to use</a>
  </div>
  <div class="status" id="status">Loading plays…</div>
  <div id="watchBar" class="watch-sticky hidden">
    <label class="watching"><span>Watching as</span><select id="watchingAs" aria-label="Watching as"><option value="">Choose first name</option></select></label>
    <a class="help-how" href="parent-guide.html">Help / How to use</a>
    <div class="study-switch hidden" id="studySwitch" role="group" aria-label="Study letter or zone"></div>
  </div>
  <section id="list" class="hidden" aria-label="Published plays">
    <div id="picks"></div>
  </section>
  <section id="viewer" class="hidden" aria-label="Selected play">
    <button class="back" type="button" id="back">← Home</button>
    <div class="play-shell" id="playShell">
      <button class="done" type="button" id="done">Done</button>
      <p class="play-name" id="playName"></p>
      <p class="play-number" id="playNumber"></p>
      <div class="field-wrap"><div id="field"></div></div>
      <div class="tools"><button type="button" id="play">Play</button><button class="ghost" type="button" id="full">Full screen</button><button class="ghost" type="button" id="defense" aria-pressed="false">Defense off</button></div>
      <div class="speed" id="speedPicks" role="group" aria-label="Play speed">
        <button type="button" data-speed="0.5">0.5×</button>
        <button type="button" data-speed="1">1×</button>
        <button type="button" data-speed="2">2×</button>
      </div>
      <input class="scrub" id="scrub" type="range" min="0" max="1000" value="0" aria-label="Animation position">
    </div>
  </section>
  <section id="defenseView" class="hidden" aria-label="Defense zones">
    <button class="back" type="button" id="defenseBack">← Home</button>
    <div class="play-shell" id="defenseShell">
      <button class="done" type="button" id="defenseDone">Done</button>
      <p class="play-name" id="defenseName"><small>Defense</small>Base zone</p>
      <div class="field-wrap"><div id="defenseField"></div></div>
      <div class="tools one" id="defenseTools"><button class="ghost" type="button" id="defenseFull">Full screen</button></div>
    </div>
  </section>
  <p class="stamp" id="stamp"></p>
</main>
<script>
const $=selector=>document.querySelector(selector);
const $$=selector=>[...document.querySelectorAll(selector)];
const SB_URL="https://adjnmtpjoyxvmlogjjpz.supabase.co";
const SB_KEY="sb_publishable_iNNI1IuOPsOmkDPLZ-k9mw_t4Gxt4TW";
const sb=(window.supabase&&supabase.createClient)?supabase.createClient(SB_URL,SB_KEY,{auth:{storageKey:"commodores-watch",persistSession:false,autoRefreshToken:false}}):null;
const LETTERS=["Q","C","X","A","B","Y","Z"];
// Offense letter colors — one map for name pills, route lines, and tip arrows.
// Readable on black turf. Q stays white so the thrower is distinct.
// Keep these hexes in sync across plays.html, watch.html, and commodores.html.
const POSITION_COLOR={
  Q:"#FFFFFF", // thrower
  C:"#CFAE70", // brand gold — center
  X:"#5EC8E8", // sky — left out
  A:"#F4A261", // sand-orange — slot
  B:"#7ED47A", // mint — inside / H-back
  Y:"#C9A6F0", // lilac — slot
  Z:"#FF8B7A"  // salmon — right out
};
function positionColor(letter){
  return POSITION_COLOR[String(letter||"").toUpperCase()]||"#CFAE70";
}
const SPEED_KEY="commodores-play-speed";
const WATCHING_KEY="commodores-watching-as";
const SPEEDS=[0.5,1,2];
const PLAY_SECTIONS=["playbook","upcoming"];
const SECTION_LABELS={playbook:"Playbook",upcoming:"Upcoming"};
function loadSpeed(){const value=Number(localStorage.getItem(SPEED_KEY));return SPEEDS.includes(value)?value:0.5}
function saveSpeed(speed){try{localStorage.setItem(SPEED_KEY,String(speed))}catch(_){}}
const state={plays:[],roster:[],number:"",watchingAs:localStorage.getItem(WATCHING_KEY)||"",studyLetter:"",studyZone:"",view:"home",defenseOverlay:false,look:0,anim:null,speed:loadSpeed()};
const esc=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function playDisplayName(play){
  const number=String((play&&play.number)||"").trim();
  const stripped=String((play&&play.title)||"").replace(/^\d+\s*/,"").trim();
  const title=stripped&&stripped!==number?stripped:"";
  return {number,title,line:title||(number?"Play "+number:"Play")};
}
function setPlayName(play){
  const shown=playDisplayName(play);
  const nameEl=$("#playName");
  const numberEl=$("#playNumber");
  if(nameEl) nameEl.innerHTML=shown.title&&shown.number
    ?`<small>Play ${esc(shown.number)}</small>${esc(shown.title)}`
    :esc(shown.line);
  if(numberEl) numberEl.innerHTML=shown.number
    ?(shown.title?`${esc(shown.number)}<small>${esc(shown.title)}</small>`:esc(shown.number))
    :esc(shown.line);
}
function pointAlong(start,points,t){
  const pts=[start,...(points||[])],segments=[];let total=0;
  for(let i=1;i<pts.length;i++){const length=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);segments.push({a:pts[i-1],b:pts[i],length});total+=length}
  if(!total)return{x:start.x,y:start.y};
  let distance=Math.max(0,Math.min(1,t))*total;
  for(const segment of segments){if(distance<=segment.length){const p=segment.length?distance/segment.length:1;return{x:segment.a.x+(segment.b.x-segment.a.x)*p,y:segment.a.y+(segment.b.y-segment.a.y)*p}}distance-=segment.length}
  return pts[pts.length-1];
}
function cleanJersey(value){const jersey=String(value==null?"":value).trim();return/^\d{1,2}$/.test(jersey)?jersey:""}
function cleanRoster(raw){return(Array.isArray(raw)?raw:[]).map(item=>({
  name:String(item&&item.name||"").trim(),
  jersey:cleanJersey(item&&item.jersey),
  // Array order is rank. Index 0 is the gold primary. Never sort.
  offenseTags:[...new Set((item&&Array.isArray(item.offenseTags)?item.offenseTags:[]).filter(tag=>LETTERS.includes(tag)))],
  defenseTags:[...new Set((item&&Array.isArray(item.defenseTags)?item.defenseTags:[]).filter(tag=>/^D[1-7]$/.test(tag)))]
})).filter(item=>item.name)}
function primaryOffense(player){return player&&player.offenseTags&&player.offenseTags[0]||""}
function backupOffense(player){return player&&Array.isArray(player.offenseTags)?player.offenseTags.slice(1):[]}
function primaryDefense(player){return player&&player.defenseTags&&player.defenseTags[0]||""}
function backupDefense(player){return player&&Array.isArray(player.defenseTags)?player.defenseTags.slice(1):[]}
function studyLetter(){const player=watchingPlayer();return state.studyLetter||primaryOffense(player)}
function studyZone(){const player=watchingPlayer();return state.studyZone||primaryDefense(player)}
function cleanPlay(raw){
  if(!raw||!String(raw.number||"").match(/^\d{1,4}$/)||!Array.isArray(raw.spots))return null;
  const fromW=playCoordWidth(raw);
  const spots=LETTERS.map(letter=>{
    const source=raw.spots.find(spot=>spot&&spot.letter===letter)||{};
    const route=Array.isArray(source.route)?source.route.map(point=>{
      const x=scaleX(Number(point.x),fromW),y=Number(point.y);
      return Number.isFinite(x)&&Number.isFinite(y)?{x,y}:null;
    }).filter(Boolean):[];
    const x=scaleX(Number(source.x),fromW);
    return{letter,x:Number.isFinite(x)?x:FIELD_W/2,y:Number(source.y)||300,sit:!!source.sit,route};
  });
  return{number:String(raw.number),title:String(raw.title||"").slice(0,48),family:String(raw.family||""),looks:Array.isArray(raw.looks)?raw.looks:[],fieldW:FIELD_W,spots,section:raw.section==="upcoming"?"upcoming":"playbook",sortOrder:Number.isInteger(Number(raw.sortOrder))?Number(raw.sortOrder):0};
}
function currentPlay(){return state.plays.find(play=>play.number===state.number)||null}
function rosterJersey(name){return cleanJersey((state.roster.find(item=>item.name===name)||{}).jersey)}
function runnerNames(play,letter){
  const player=watchingPlayer();
  return player&&studyLetter()===letter?[player.name]:[];
}
function runnerLabel(name){const jersey=rosterJersey(name);return jersey?`${name} ${jersey}`:name}
function routeName(play,letter){const names=runnerNames(play,letter).map(runnerLabel);return names.length?names.join(" / "):letter}
function packedLines(parts,maxLength){
  const lines=[];
  parts.forEach(part=>{const last=lines[lines.length-1]||"";if(last&&(last+" / "+part).length<=maxLength)lines[lines.length-1]=last+" / "+part;else lines.push(part)});
  return lines;
}
function watchingPlayer(){return state.roster.find(item=>item.name===state.watchingAs)||null}
function letterFocused(letter){
  const player=watchingPlayer();
  if(!player) return true;
  const study=studyLetter();
  return !study||study===letter;
}
function path(start,points){return`M${start.x} ${start.y}`+(points||[]).map(point=>`L${point.x} ${point.y}`).join("")}
// Saved routes stay in viewBox coordinates; only yard-marker labels map the
// existing LOS-to-goal-line depth to the 45-yard field.
// Formation starts render six units closer to the LOS without changing the
// snapshot coordinates or the relative on-line/off-line spacing.
const LEGACY_FIELD_W=360,FIELD_W=480,FIELD_H=400,FIELD_LEFT=8,FIELD_RIGHT=FIELD_W-8,FIELD_TOP=10,MID_X=FIELD_W/2,LOS_Y=300,YARD=7,FIELD_DEPTH_YARDS=45,DISPLAY_OFFENSE_OFF=12,START_DISPLAY_SHIFT=6;
function scaleX(x,fromW){const src=Number(fromW)||LEGACY_FIELD_W;if(!Number.isFinite(x)||src===FIELD_W)return x;return x*FIELD_W/src}
function playCoordWidth(raw){
  const top=Number(raw&&raw.fieldW);if(top===FIELD_W||top===LEGACY_FIELD_W)return top;
  const marked=(raw&&Array.isArray(raw.spots)?raw.spots:[]).find(s=>Number(s&&s.fieldW)===FIELD_W||Number(s&&s.fieldW)===LEGACY_FIELD_W);
  return marked?Number(marked.fieldW):LEGACY_FIELD_W;
}
function pillSize(label){const name=String(label||""),len=name.length;return{width:Math.max(22,Math.min(48,11+len*4.4)),height:22,font:len>9?7:len>6?8:9}}
function formationPoint(spot){
  const y=Number(spot&&spot.y);
  return{x:Number(spot&&spot.x),y:Number.isFinite(y)&&y>=LOS_Y?Math.max(LOS_Y+DISPLAY_OFFENSE_OFF,y-START_DISPLAY_SHIFT):y};
}
function routeTip(start,points){
  const pts=[start,...(points||[])].filter(point=>point&&Number.isFinite(point.x)&&Number.isFinite(point.y));
  if(pts.length<2)return null;
  const tip=pts[pts.length-1];
  let prev=pts[pts.length-2];
  for(let i=pts.length-2;i>=0;i--){if(Math.hypot(tip.x-pts[i].x,tip.y-pts[i].y)>6){prev=pts[i];break}}
  const dx=tip.x-prev.x,dy=tip.y-prev.y,len=Math.hypot(dx,dy);
  if(len<4)return null;
  return{x:tip.x,y:tip.y,ux:dx/len,uy:dy/len};
}
function arrow(start,points,color,size,opacity){
  const tip=routeTip(start,points);if(!tip)return"";
  const s=size||8,w=s*.55,bx=tip.x-tip.ux*s,by=tip.y-tip.uy*s,px=-tip.uy*w,py=tip.ux*w;
  return`<polygon points="${tip.x},${tip.y} ${bx+px},${by+py} ${bx-px},${by-py}" fill="${color}" opacity="${opacity==null?1:opacity}"/>`;
}
function route(start,points,letter,on){
  if(!points||!points.length)return"";
  const color=positionColor(letter),width=on?4.2:2.6,opacity=on?1:.82;
  return`<path d="${esc(path(start,points))}" fill="none" stroke="${color}" stroke-width="${width}" stroke-linecap="round" stroke-linejoin="round" opacity="${opacity}"/>${arrow(start,points,color,on?9:7,opacity)}`;
}
function nameBubble(start,label,letter,on){
  const parts=String(label||letter).split(" / "),lines=[];
  parts.forEach(part=>{const last=lines[lines.length-1]||"";if(last&&(last+" / "+part).length<=20)lines[lines.length-1]=last+" / "+part;else lines.push(part)});
  const longest=Math.max(...lines.map(line=>line.length)),width=Math.max(24,Math.min(118,13+longest*4.7)),height=Math.max(22,8+lines.length*10),top=start.y-height/2,color=positionColor(letter);
  const text=lines.map((line,index)=>`<tspan x="${start.x}" y="${top+12+index*10}">${esc(line)}</tspan>`).join("");
  return`<g class="runner-name" data-runner-letter="${letter}"><rect x="${start.x-width/2}" y="${top}" width="${width}" height="${height}" rx="11" fill="${color}" stroke="${on?"#fff":"#1C1C1C"}" stroke-width="${on?2.5:1.8}"/><text fill="#1C1C1C" text-anchor="middle" font-size="8">${text}</text></g>`;
}
function routeLetter(start,points,letter,on){
  if(!points||!points.length)return"";
  const point=pointAlong(start,points,.48),color=positionColor(letter);
  return`<g class="route-letter" data-route-letter="${letter}"><circle cx="${point.x}" cy="${point.y}" r="${on?9:8}" fill="#000" stroke="${color}" stroke-width="${on?3:2}"/><text x="${point.x}" y="${point.y+3}" fill="${color}" text-anchor="middle" font-size="8">${letter}</text></g>`;
}
function yardLines(){
  const ticks=[];const labels=[];
  const markerYard=(LOS_Y-FIELD_TOP)/FIELD_DEPTH_YARDS;
  for(let yards=5;yards<FIELD_DEPTH_YARDS;yards+=5){const y=LOS_Y-markerYard*yards;ticks.push(`M${FIELD_LEFT} ${y}H${FIELD_RIGHT}`);labels.push(`<text x="18" y="${y-4}" fill="rgba(224,213,192,.55)" font-size="8">${yards}</text>`)}
  return`<g class="yards"><path class="yard" d="${ticks.join("")}" fill="none"/>${labels.join("")}<path d="M${FIELD_LEFT} ${FIELD_TOP}H${FIELD_RIGHT}" fill="none" stroke="#CFAE70" stroke-width="3"/><text x="18" y="${FIELD_TOP+14}" fill="#ECB748" font-size="10">45 / TD</text></g>`;
}
function defenseZonesSVG(){
  // Facing the football / offense at the bottom: D1 is defense-right
  // (screen-left), D3 defense-left. Second level is D6 / D5 / D4 behind
  // those, listed defense-left to defense-right as D4, D5, D6. D7 sits
  // deep behind D5. Static outlines only — no moving pieces.
  const shortY=LOS_Y-YARD*10,deepY=LOS_Y-YARD*22,roverY=LOS_Y-YARD*36;
  const player=watchingPlayer();
  const study=player?studyZone():"";
  const backups=player?backupDefense(player):[];
  const box=(area,y,height)=>{
    const tag="D"+area.zone;
    const isStudy=!!study&&study===tag;
    const isBackup=!!study&&backups.includes(tag);
    const opacity=!study?0.88:(isStudy?1:isBackup?0.42:0.16);
    const fill=isStudy?"rgba(236,183,72,.28)":"rgba(207,174,112,.1)";
    const stroke=isStudy?"#ECB748":"#CFAE70";
    const width=isStudy?3:1.6;
    const label=isStudy&&player?`${tag} · ${player.name}`:tag;
    return`<g opacity="${opacity}"><rect x="${area.x-68}" y="${y-height/2}" width="136" height="${height}" rx="12" fill="${fill}" stroke="${stroke}" stroke-width="${width}"/><text x="${area.x}" y="${y+4}" fill="${isStudy?"#ECB748":"#E0D5C0"}" text-anchor="middle" font-size="${isStudy?11:10}">${esc(label)}</text></g>`;
  };
  const front=[{x:90,zone:1},{x:MID_X,zone:2},{x:390,zone:3}].map(area=>box(area,shortY,78)).join("");
  const second=[{x:90,zone:6},{x:MID_X,zone:5},{x:390,zone:4}].map(area=>box(area,deepY,86)).join("");
  const tag="D7";
  const isStudy=!!study&&study===tag;
  const isBackup=!!study&&backups.includes(tag);
  const safetyOpacity=!study?0.88:(isStudy?1:isBackup?0.42:0.16);
  const safetyLabel=isStudy&&player?`D7 · ${player.name}`:"D7";
  return`${front}${second}<g opacity="${safetyOpacity}"><polygon points="${MID_X},${roverY-16} ${MID_X+15},${roverY} ${MID_X},${roverY+16} ${MID_X-15},${roverY}" fill="${isStudy?"#ECB748":"#CFAE70"}" stroke="#1C1C1C" stroke-width="2"/><text x="${MID_X}" y="${roverY+32}" fill="#ECB748" text-anchor="middle" font-size="11">${esc(safetyLabel)}</text></g><text x="${MID_X}" y="388" fill="#ECB748" text-anchor="middle" font-size="9">thrower · do not rush</text>`;
}
function paintDefense(){
  const player=watchingPlayer();
  const title=player?`${player.name} · defense`:"Six areas + helper";
  $("#defenseField").innerHTML=`<svg class="field" viewBox="0 0 ${FIELD_W} ${FIELD_H}" role="img" aria-label="${esc(title)}"><rect width="${FIELD_W}" height="${FIELD_H}" fill="#000"/><rect x="${FIELD_LEFT}" y="10" width="${FIELD_RIGHT-FIELD_LEFT}" height="${FIELD_H-20}" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="2"/>${yardLines()}<path d="M${FIELD_LEFT} ${LOS_Y}H${FIELD_RIGHT}" fill="none" stroke="#CFAE70" stroke-width="2" stroke-dasharray="7 5"/><text x="18" y="${LOS_Y-8}" fill="#E0D5C0" font-size="9">0 / LOS</text>${defenseZonesSVG()}</svg>`;
  const name=$("#defenseName");
  if(name) name.innerHTML=player?`<small>Base zone</small>${esc(player.name)}`:`<small>Defense</small>Base zone`;
}
function stop(){if(!state.anim)return;if(state.anim.frame)cancelAnimationFrame(state.anim.frame);state.anim=null;$("#play").textContent="Play"}
function paint(progress){
  const play=currentPlay();if(!play)return;
  const q=formationPoint(play.spots.find(spot=>spot.letter==="Q")),c=formationPoint(play.spots.find(spot=>spot.letter==="C"));
  const targetLetter=play.looks[state.look]&&play.looks[state.look].target;
  const target=play.spots.find(spot=>spot.letter===targetLetter);
  const destination=target&&!target.sit?pointAlong(formationPoint(target),target.route,1):null;
  const snap=.096,run=.835,positions={};
  play.spots.forEach(spot=>{const start=formationPoint(spot);positions[spot.letter]=progress<snap||spot.sit||!spot.route.length?start:pointAlong(start,spot.route,ease(Math.min(1,(progress-snap)/(run-snap))))});
  let ball={x:c.x,y:c.y};
  if(progress<snap){const p=ease(progress/snap);ball={x:c.x+(q.x-c.x)*p,y:c.y+(q.y-c.y)*p}}
  else if(progress<run){ball={x:positions.Q.x,y:positions.Q.y+10}}
  else if(destination){const p=ease((progress-run)/(1-run));ball={x:positions.Q.x+(destination.x-positions.Q.x)*p,y:positions.Q.y+(destination.y-positions.Q.y)*p}}
  else ball=positions.Q;
  const highlighted=new Set([targetLetter]);
  const routes=play.spots.filter(spot=>spot.letter!=="Q"&&spot.route.length).map(spot=>`<g opacity="${letterFocused(spot.letter)?1:.18}">${route(formationPoint(spot),spot.route,spot.letter,highlighted.has(spot.letter))}</g>`).join("");
  const routeLetters=play.spots.map(spot=>`<g opacity="${letterFocused(spot.letter)?1:.18}">${routeLetter(formationPoint(spot),spot.route,spot.letter,highlighted.has(spot.letter))}</g>`).join("");
  const runners=play.spots.filter(spot=>spot.route.length).map(spot=>{const point=positions[spot.letter];return`<circle class="route-runner" data-letter="${spot.letter}" cx="${point.x}" cy="${point.y}" r="6" fill="${positionColor(spot.letter)}" stroke="#1C1C1C" stroke-width="1.5" opacity="${letterFocused(spot.letter)?1:.18}"/>`}).join("");
  const bubbles=play.spots.map(spot=>`<g opacity="${letterFocused(spot.letter)?1:.18}">${nameBubble(formationPoint(spot),routeName(play,spot.letter),spot.letter,highlighted.has(spot.letter))}</g>`).join("");
  const overlay=state.defenseOverlay?`<g class="defense-overlay" opacity=".55">${defenseZonesSVG()}</g>`:"";
  $("#field").innerHTML=`<svg class="field" viewBox="0 0 ${FIELD_W} ${FIELD_H}" role="img" aria-label="${esc(playDisplayName(play).line)}"><rect width="${FIELD_W}" height="${FIELD_H}" fill="#000"/><rect x="${FIELD_LEFT}" y="10" width="${FIELD_RIGHT-FIELD_LEFT}" height="${FIELD_H-20}" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="2"/>${yardLines()}<path d="M${FIELD_LEFT} ${LOS_Y}H${FIELD_RIGHT}" fill="none" stroke="#CFAE70" stroke-width="2" stroke-dasharray="7 5"/><text x="18" y="${LOS_Y-8}" fill="#E0D5C0" font-size="9">0 / LOS</text>${overlay}${routes}${routeLetters}${runners}<circle cx="${ball.x}" cy="${ball.y}" r="5" fill="#CFAE70"/>${bubbles}</svg>`;
  $("#scrub").value=String(Math.round(progress*1000));
}
function showHome(){
  stop();
  setImmersive(false);
  state.number="";
  state.view="home";
  state.defenseOverlay=false;
  renderPage();
}
function selectPlay(number){
  const play=state.plays.find(item=>item.number===String(number));
  if(!play)return;
  stop();
  state.view="play";
  state.number=play.number;
  state.look=0;
  renderPage();
}
function selectBaseZone(){
  stop();
  setImmersive(false);
  state.view="defense";
  state.number="";
  renderPage();
}
function syncWatching(){
  if(state.watchingAs&&!state.roster.some(item=>item.name===state.watchingAs)) state.watchingAs="";
  const player=watchingPlayer();
  if(player){
    if(!player.offenseTags.includes(state.studyLetter)) state.studyLetter=primaryOffense(player);
    if(!player.defenseTags.includes(state.studyZone)) state.studyZone=primaryDefense(player);
  }else{
    state.studyLetter="";
    state.studyZone="";
  }
  $("#watchingAs").innerHTML=`<option value="">Choose first name</option>`+state.roster.map(item=>`<option value="${esc(item.name)}">${esc(runnerLabel(item.name))}</option>`).join("");
  $("#watchingAs").value=state.watchingAs;
}
function renderStudySwitch(){
  const root=$("#studySwitch");
  if(!root) return;
  const player=watchingPlayer();
  const onDetail=state.view==="play"||state.view==="defense";
  const tags=state.view==="defense"
    ?(player?player.defenseTags:[])
    :(player?player.offenseTags:[]);
  if(!onDetail||!player||tags.length<2){
    root.classList.add("hidden");
    root.innerHTML="";
    return;
  }
  const current=state.view==="defense"?studyZone():studyLetter();
  root.classList.remove("hidden");
  root.innerHTML=tags.map(tag=>`<button type="button" data-study="${esc(tag)}" class="${tag===current?"on":""}">${esc(tag)}</button>`).join("");
  $$("#studySwitch [data-study]").forEach(button=>button.onclick=()=>{
    if(state.view==="defense") state.studyZone=button.dataset.study;
    else state.studyLetter=button.dataset.study;
    renderPage();
  });
}
function renderDefenseToggle(){
  const button=$("#defense");
  if(!button) return;
  button.textContent=state.defenseOverlay?"Defense on":"Defense off";
  button.classList.toggle("on",state.defenseOverlay);
  button.setAttribute("aria-pressed",state.defenseOverlay?"true":"false");
}
function renderList(){
  const offense=PLAY_SECTIONS.map(section=>{
    const plays=state.plays.filter(item=>item.section===section);
    if(!plays.length)return"";
    const buttons=plays.map(item=>{
      const shown=playDisplayName(item);
      return `<button type="button" data-play="${esc(item.number)}"><b>${esc(shown.number||shown.line)}</b><small>${esc(shown.title||"Watch")}</small></button>`;
    }).join("");
    return `<section class="play-group" aria-labelledby="${section}Heading"><h3 id="${section}Heading">${SECTION_LABELS[section]} <span>${plays.length} play${plays.length===1?"":"s"}</span></h3><div class="picks">${buttons}</div></section>`;
  }).join("");
  $("#picks").innerHTML=`
    <section class="home-section" aria-labelledby="offenseHeading">
      <h2 id="offenseHeading">Offense</h2>
      <div class="play-groups">${offense||`<p class="sub">No published offense plays yet.</p>`}</div>
    </section>
    <section class="home-section" aria-labelledby="defenseHeading">
      <h2 id="defenseHeading">Defense</h2>
      <div class="picks"><button type="button" id="baseZoneCard"><b>Base zone</b><small>Six areas + helper · no rush</small></button></div>
    </section>`;
  $$("#picks [data-play]").forEach(button=>button.onclick=()=>selectPlay(button.dataset.play));
  const base=$("#baseZoneCard");
  if(base) base.onclick=selectBaseZone;
}
function renderPage(){
  const loaded=!!state.plays.length;
  $("#watchBar").classList.toggle("hidden",!loaded);
  document.body.dataset.view=state.view;
  syncWatching();
  renderStudySwitch();
  renderDefenseToggle();
  if(state.view==="defense"){
    $("#intro").classList.add("hidden");
    $("#list").classList.add("hidden");
    $("#viewer").classList.add("hidden");
    $("#defenseView").classList.remove("hidden");
    paintDefense();
    syncViewport();
    return;
  }
  $("#defenseView").classList.add("hidden");
  if(state.view==="play"){
    const play=currentPlay();
    if(!play){state.view="home"}
    else{
      $("#intro").classList.add("hidden");
      $("#list").classList.add("hidden");
      $("#viewer").classList.remove("hidden");
      setPlayName(play);
      paint(0);
      syncViewport();
      return;
    }
  }
  state.view="home";
  document.body.dataset.view="home";
  $("#intro").classList.remove("hidden");
  $("#list").classList.remove("hidden");
  $("#viewer").classList.add("hidden");
  syncViewport();
}
function renderSpeed(){
  $$("#speedPicks [data-speed]").forEach(button=>{
    const value=Number(button.dataset.speed);
    button.classList.toggle("on",value===state.speed);
    button.setAttribute("aria-pressed",value===state.speed?"true":"false");
  });
}
function setSpeed(speed){
  const next=SPEEDS.includes(Number(speed))?Number(speed):0.5;
  state.speed=next;
  saveSpeed(next);
  renderSpeed();
}
function play(){
  if(state.anim){stop();return}
  const started=performance.now(),duration=2300/(state.speed||0.5);state.anim={frame:0};$("#play").textContent="Pause";
  const tick=now=>{const progress=Math.min(1,(now-started)/duration);paint(progress);if(progress<1){state.anim.frame=requestAnimationFrame(tick);return}state.anim=null;$("#play").textContent="Play"};
  state.anim.frame=requestAnimationFrame(tick);
}
function viewportBox(){
  const vv=window.visualViewport;
  return {
    w:Math.max(1,Math.round((vv&&vv.width)||window.innerWidth||document.documentElement.clientWidth||1)),
    h:Math.max(1,Math.round((vv&&vv.height)||window.innerHeight||document.documentElement.clientHeight||1)),
    x:Math.round((vv&&vv.offsetLeft)||0),
    y:Math.round((vv&&vv.offsetTop)||0)
  };
}
function unlockOrientation(){
  try{if(screen.orientation&&screen.orientation.unlock) screen.orientation.unlock()}catch(_){}
}
function syncViewport(){
  const box=viewportBox();
  const root=document.documentElement;
  root.style.setProperty("--vvw",box.w+"px");
  root.style.setProperty("--vvh",box.h+"px");
  root.style.setProperty("--vvx",box.x+"px");
  root.style.setProperty("--vvy",box.y+"px");
  root.classList.toggle("portrait",box.h>box.w);
  root.classList.toggle("landscape",box.w>=box.h);
  const field=document.querySelector(".field");
  if(field) void field.getBoundingClientRect();
}
function bindViewport(){
  const kick=()=>{syncViewport();requestAnimationFrame(syncViewport)};
  window.addEventListener("resize",kick);
  window.addEventListener("orientationchange",()=>{unlockOrientation();kick();setTimeout(kick,80);setTimeout(kick,320)});
  if(window.visualViewport){visualViewport.addEventListener("resize",kick);visualViewport.addEventListener("scroll",kick)}
  document.addEventListener("visibilitychange",()=>{if(!document.hidden) kick()});
  unlockOrientation();
  kick();
}
function setImmersive(active){
  document.body.classList.toggle("immersive",active);
  if(document.fullscreenElement&&document.exitFullscreen) document.exitFullscreen().catch(()=>{});
  syncViewport();
}
$("#watchingAs").onchange=()=>{
  state.watchingAs=$("#watchingAs").value;
  state.studyLetter="";
  state.studyZone="";
  try{localStorage.setItem(WATCHING_KEY,state.watchingAs)}catch(_){}
  stop();
  renderPage();
};
$("#play").onclick=play;
$("#defense").onclick=()=>{stop();state.defenseOverlay=!state.defenseOverlay;renderPage()};
$("#speedPicks").onclick=event=>{const button=event.target.closest("[data-speed]");if(!button)return;setSpeed(button.dataset.speed)};
$("#full").onclick=()=>{unlockOrientation();setImmersive(true)};
$("#done").onclick=()=>setImmersive(false);
$("#defenseFull").onclick=()=>{unlockOrientation();setImmersive(true)};
$("#defenseDone").onclick=()=>setImmersive(false);
$("#back").onclick=showHome;
$("#defenseBack").onclick=showHome;
renderSpeed();
document.addEventListener("fullscreenchange",()=>{if(document.fullscreenElement&&document.exitFullscreen) document.exitFullscreen().catch(()=>{})});
$("#scrub").oninput=()=>{stop();paint(Number($("#scrub").value)/1000)};
bindViewport();
(async()=>{
  const token=new URLSearchParams(location.search).get("t")||"";
  if(!sb||!/^[A-Za-z0-9_-]{43,}$/.test(token)){$("#status").textContent="This play link is not available.";return}
  try{
    const {data,error}=await sb.rpc("commodores_watch_plays",{p_token:token});
    const plays=data&&Array.isArray(data.plays)?data.plays.map(cleanPlay).filter(Boolean):[];
    if(error||!data||!plays.length)throw new Error("unavailable");
    state.plays=plays;state.roster=cleanRoster(data.roster);
    $("#status").classList.add("hidden");
    if(data.publishedAt){const date=new Date(data.publishedAt);if(!Number.isNaN(date.getTime()))$("#stamp").textContent="Playbook updated "+date.toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}
    renderList();
    renderPage();
  }catch(_){$("#status").textContent="This play link is not available."}
})();
</script>
</body>
</html>

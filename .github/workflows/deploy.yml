name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # The Commodores staff field book and play animator are NOT served on
      # this public GitHub Pages site. They are hosted on the Cloudflare
      # Worker / Pages origin behind Cloudflare Access. Strip them from the
      # public artifact. Do not remove this step.
      - name: Exclude staff field book from the public site
        run: rm -f commodores.html commodores.webmanifest plays.html plays.webmanifest

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

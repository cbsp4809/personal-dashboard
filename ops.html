<style>
:root{
  color-scheme: dark;
  --bg:#12110f;
  --bg-2:#181612;
  --panel:#1e1b17;
  --card:#25221c;
  --card-hover:#2c2821;
  --ink:#f4efe6;
  --soft:#d4cdc0;
  --muted:#9a9286;
  --line:rgba(244,239,230,.09);
  --line-strong:rgba(244,239,230,.16);
  --brass:#c4a574;
  --brass-soft:rgba(196,165,116,.16);
  --needs:#d4a09a;
  --today:#c4a574;
  --week:#8fa3b0;
  --later:#8c877c;
  --sydney:#9aaf98;
  --over:#c97a6a;
  --soon:#d4b06a;
  --shadow:0 10px 40px rgba(0,0,0,.28);
  --sans:"Figtree", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --serif:"Newsreader", Georgia, "Times New Roman", serif;
  --radius:12px;
}
*{box-sizing:border-box}
html{margin:0;min-height:100%;width:100%;max-width:100%;overflow-x:hidden;background:var(--bg);}
body{margin:0;min-height:100%;min-height:100dvh;width:100%;max-width:100%;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased;}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brass)}
.hidden{display:none !important}

#boot{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-size:12px;}

#login{min-height:100vh;min-height:100dvh;display:none;align-items:center;justify-content:center;padding:max(32px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) max(32px, env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));background:
  radial-gradient(900px 420px at 50% -10%, rgba(196,165,116,.12), transparent 60%), var(--bg);}
.login-card{width:min(420px,100%);background:var(--panel);border:1px solid var(--line-strong);border-radius:18px;padding:34px 32px 28px;box-shadow:var(--shadow);}
.login-kicker{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--brass);margin-bottom:10px;}
.login-card h1{font-family:var(--serif);font-weight:400;font-size:34px;margin:0 0 8px;letter-spacing:-.02em;}
.login-card p{color:var(--muted);margin:0 0 22px;font-size:14px;}
.login-card label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;}
.login-card input{width:100%;background:var(--bg);border:1px solid var(--line-strong);border-radius:10px;padding:11px 12px;margin-bottom:12px;}
.login-card input:focus{outline:none;border-color:var(--brass);}
.btn{background:var(--brass);color:#1a160f;border:none;border-radius:10px;padding:11px 16px;font-weight:700;letter-spacing:.04em;}
.btn:hover{filter:brightness(1.06);}
.btn:disabled{opacity:.55;cursor:not-allowed;}
.btn.ghost{background:transparent;color:var(--soft);border:1px solid var(--line-strong);}
.btn.tiny{padding:6px 10px;font-size:12px;border-radius:8px;font-weight:600;letter-spacing:.02em;}
.linkish{display:block;width:100%;margin-top:10px;background:none;border:none;color:var(--muted);font-size:13px;text-align:center;}
.linkish:hover{color:var(--ink);}
.login-msg{min-height:1.4em;margin-top:12px;color:var(--brass);font-size:13px;text-align:center;}
.login-foot{margin-top:22px;text-align:center;font-size:12px;color:var(--muted);}
.login-foot a{color:var(--soft);}
.install-hint{margin-top:10px;font-size:12px;line-height:1.4;color:var(--muted);}

#app{display:none;min-height:100vh;width:100%;max-width:100%;overflow-x:hidden;padding-bottom:calc(92px + env(safe-area-inset-bottom, 0px));}
.top{width:100%;min-width:0;padding:22px 28px 0;max-width:1720px;margin:0 auto;}
.mast{display:flex;min-width:0;max-width:100%;align-items:flex-start;justify-content:space-between;gap:20px;padding-bottom:18px;border-bottom:1px solid var(--line);}
.brand{min-width:0;}
.brand .kicker{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--brass);margin-bottom:6px;}
.brand h1{font-family:var(--serif);font-weight:400;font-size:32px;margin:0;letter-spacing:-.03em;}
.brand h1 em{font-style:italic;color:var(--soft);}
.navlinks{display:flex;gap:16px;margin-top:10px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;}
.navlinks a{color:var(--muted);text-decoration:none;}
.navlinks a:hover,.navlinks a.here{color:var(--ink);}
.mast-right{display:flex;min-width:0;flex-direction:column;align-items:flex-end;gap:10px;text-align:right;}
.clock .time{font-family:var(--serif);font-size:28px;letter-spacing:.02em;}
.clock .date{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:2px;}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;}
.who span{font-size:12px;color:var(--muted);}
.alert-wrap{position:relative;flex-shrink:0;}
.alert-btn{position:relative;width:44px;height:44px;min-width:44px;min-height:44px;padding:0;display:inline-flex;align-items:center;justify-content:center;background:transparent;color:var(--soft);border:1px solid var(--line-strong);border-radius:12px;-webkit-tap-highlight-color:transparent;}
.alert-btn:hover,.alert-btn[aria-expanded="true"]{color:var(--ink);border-color:rgba(196,165,116,.45);background:var(--brass-soft);}
.alert-btn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.alert-badge{position:absolute;top:-5px;right:-5px;min-width:21px;height:21px;padding:0 5px;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);border-radius:999px;background:#df3f4d;color:#fff!important;font-size:10px!important;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;}
.alert-back{position:fixed;inset:0;z-index:44;background:rgba(0,0,0,.4);}
.alert-panel{position:absolute;z-index:45;top:calc(100% + 8px);right:0;width:min(380px,calc(100vw - 32px));max-width:calc(100vw - 32px);max-height:min(560px,calc(100dvh - 100px));overflow:hidden;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line-strong);border-radius:16px;box-shadow:var(--shadow);text-align:left;}
.alert-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 14px 10px;border-bottom:1px solid var(--line);}
.alert-head h2{margin:0;font-family:var(--serif);font-size:23px;font-weight:400;}
.alert-mark-all{min-height:44px;background:none;border:0;color:var(--brass);font-size:12px;font-weight:600;padding:8px;}
.alert-mark-all:disabled{color:var(--muted);opacity:.65;cursor:default;}
.alert-list{min-width:0;overflow-y:auto;overscroll-behavior:contain;}
.alert-item{width:100%;min-width:0;min-height:64px;padding:11px 14px;display:block;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--soft);text-align:left;}
.alert-item:hover,.alert-item:focus-visible{background:var(--card);outline:none;}
.alert-item.unread{box-shadow:inset 3px 0 #df3f4d;}
.alert-item-title{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);font-size:13.5px;font-weight:600;}
.alert-item-body{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px;color:var(--muted);font-size:12px;}
.alert-item-time{display:block;margin-top:4px;color:var(--muted);font-size:10.5px;}
.alert-empty{padding:28px 16px;text-align:center;color:var(--muted);font-family:var(--serif);font-style:italic;}
.alert-foot{padding:9px 14px;color:var(--muted);font-size:10.5px;border-top:1px solid var(--line);}
.actor{display:inline-flex;background:var(--bg-2);border:1px solid var(--line-strong);border-radius:999px;padding:2px;}
.actor button{background:transparent;border:none;color:var(--muted);padding:5px 10px;border-radius:999px;font-size:12px;font-weight:600;}
.actor button.on{background:var(--brass-soft);color:var(--ink);}

.viewbar{display:flex;min-width:0;max-width:100%;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 12px;}
.viewbar-label{color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase;}
.viewbar .actor button{min-width:92px;padding:9px 18px;font-size:13px;}
.email-filterbar{display:flex;min-width:0;max-width:100%;align-items:center;justify-content:space-between;gap:12px;padding:0 0 16px;}
.email-filterbar .filters{justify-content:flex-end;padding:0;}
.below-board{width:100%;min-width:0;max-width:1720px;margin:0 auto;padding:0 28px 40px;}
.toolbar{display:flex;min-width:0;max-width:100%;gap:10px;align-items:center;flex-wrap:wrap;padding:18px 0 4px;border-top:1px solid var(--line);}
.star-btn{appearance:none;background:transparent;border:1px solid var(--line-strong);color:var(--muted);border-radius:10px;width:40px;height:40px;min-width:40px;min-height:40px;padding:0;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;font-size:20px;line-height:1;-webkit-tap-highlight-color:transparent;}
.star-btn:hover{color:var(--brass);border-color:rgba(196,165,116,.4);}
.star-btn.on{color:var(--brass);background:var(--brass-soft);border-color:rgba(196,165,116,.45);}
.filters{display:flex;min-width:0;max-width:100%;gap:6px;flex-wrap:wrap;padding:10px 0 8px;}
.chip{max-width:100%;background:transparent;border:1px solid var(--line-strong);color:var(--muted);border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:600;letter-spacing:.04em;}
.chip.on{background:var(--brass-soft);border-color:transparent;color:var(--ink);}
.status{font-size:12.5px;color:var(--muted);min-height:1.2em;padding-bottom:8px;}
.status.err{color:var(--over);}

.board{display:grid;width:100%;min-width:0;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;padding:0 28px 20px;max-width:1720px;margin:0 auto;}
.board.email-board{display:block;max-width:900px;}
.email-list{min-width:0;max-width:100%;display:flex;flex-direction:column;gap:10px;}
.email-card{padding:16px;}
.email-card .card-top{gap:11px;}
.email-card .chk{width:19px;height:19px;margin-top:1px;}
.email-card .title{font-size:16px;}
.email-draft{min-width:0;max-width:100%;margin:12px 0 0 30px;padding:12px 13px;border-left:2px solid rgba(196,165,116,.45);background:rgba(18,17,15,.52);border-radius:0 8px 8px 0;color:var(--soft);font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere;user-select:text;-webkit-user-select:text;}
.email-meta{display:flex;min-width:0;max-width:100%;align-items:center;flex-wrap:wrap;gap:7px;margin:12px 0 0 30px;}
.email-actions{display:flex;justify-content:flex-end;margin:13px 0 0 30px;}
.copy-draft{min-width:112px;}
.email-empty{background:var(--bg-2);border:1px solid var(--line);border-radius:16px;padding:42px 20px;}
.col.deemphasized{opacity:.58;}
.composer{position:fixed;z-index:30;left:0;right:0;bottom:0;width:100%;max-width:100vw;overflow:hidden;background:rgba(18,17,15,.96);border-top:1px solid var(--line-strong);padding:8px max(16px, env(safe-area-inset-right, 0px)) max(8px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);}
.composer-inner{width:100%;min-width:0;max-width:900px;margin:0 auto;}
.composer-confirm{height:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--brass);font-size:11.5px;padding:0 6px 3px;}
.composer-row{display:flex;width:100%;min-width:0;max-width:100%;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line-strong);border-radius:18px;padding:6px;}
.composer-row:focus-within{border-color:rgba(196,165,116,.55);}
.composer input{flex:1;min-width:0;background:transparent;border:0;outline:0;padding:8px 6px;font-size:16px;}
.composer button{width:44px;height:44px;min-width:44px;border-radius:14px;border:0;display:inline-flex;align-items:center;justify-content:center;}
.mic-btn{background:transparent;color:var(--muted);font-size:19px;}
.mic-btn.listening{color:var(--over);background:rgba(201,122,106,.12);}
.send-btn{background:var(--brass);color:#1a160f;font-size:20px;font-weight:700;}
.send-btn:disabled{opacity:.55;cursor:wait;}
@media(max-width:1400px){.board{grid-template-columns:repeat(3,minmax(0,1fr));}}
@media(max-width:1100px){.board{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media(max-width:700px){
  #app{padding-bottom:calc(88px + env(safe-area-inset-bottom, 0px));}
  .board{grid-template-columns:minmax(0,1fr);padding:0 max(16px, env(safe-area-inset-right, 0px)) 14px max(16px, env(safe-area-inset-left, 0px));}
  .below-board{padding:0 max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px));}
  .top{padding:max(18px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));}
  .mast{align-items:center;padding-bottom:12px;}
  .mast-right{align-items:flex-end;text-align:right;}
  .clock{display:none;}
  .who{justify-content:flex-start;}
  .who #userLabel{display:none;}
  .alert-panel{position:fixed;top:max(72px,calc(env(safe-area-inset-top, 0px) + 58px));right:max(12px,env(safe-area-inset-right, 0px));left:max(12px,env(safe-area-inset-left, 0px));width:auto;max-width:none;max-height:calc(100dvh - max(88px,calc(env(safe-area-inset-top, 0px) + 74px)));}
  .brand h1{font-size:27px;}
  .brand .navlinks{display:none;}
  .viewbar{padding:12px 0 10px;}
  .viewbar-label{display:none;}
  .viewbar .actor{width:100%;}
  .viewbar .actor{display:flex;}
  .viewbar .actor button{flex:1;min-height:44px;font-size:14px;}
  .email-filterbar{display:block;padding-bottom:14px;}
  .email-filterbar .viewbar-label{display:block;margin-bottom:8px;}
  .email-filterbar .filters{justify-content:flex-start;flex-wrap:wrap;}
  .email-card{padding:14px 12px;}
  .email-draft,.email-meta,.email-actions{margin-left:30px;max-width:calc(100% - 30px);}
  .email-actions .copy-draft{width:100%;min-height:44px;}
  .login-card{padding:28px 20px 22px;}
  .login-card h1{font-size:30px;}
  .login-card input,.login-card .btn{min-height:44px;font-size:16px;}
  .toolbar .btn{min-height:44px;flex:1;}
  .card-star{width:44px;height:44px;min-width:44px;min-height:44px;font-size:22px;}
  .chip{padding:8px 14px;min-height:36px;}
  .actor button{padding:8px 14px;min-height:36px;}
  .btn.tiny{padding:10px 14px;min-height:44px;}
  .linkish{min-height:44px;padding:12px 8px;}
  .board .col{min-height:0;}
  .board .snippet,.board .meta,.board .ctrls,.board .noteta{margin-left:0;max-width:100%;}
  .ctrls > *{flex:1 1 calc(50% - 3px);width:auto;min-width:0;max-width:100%;}
  .board .noteta{width:100%;max-width:100%;}
  .col.deemphasized{opacity:.46;}
  .composer-confirm{font-size:11px;}
}
.col{min-width:0;max-width:100%;background:var(--bg-2);border:1px solid var(--line);border-radius:16px;min-height:420px;display:flex;flex-direction:column;}
.col.over{outline:1px dashed var(--brass);}
.col-h{padding:16px 16px 12px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
.col-h>div{min-width:0;}
.col-h h2{margin:0;font-size:15px;font-weight:600;letter-spacing:.01em;}
.col-h .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;}
.col-h .sub{display:block;margin-top:3px;font-size:11.5px;color:var(--muted);font-weight:400;}
.col[data-col="needs-you"] .col-h h2{color:var(--needs);}
.col[data-col="today"] .col-h h2{color:var(--today);}
.col[data-col="this-week"] .col-h h2{color:var(--week);}
.col[data-col="later"]{background:#151310;}
.col[data-col="later"] .col-h h2{color:var(--later);font-weight:500;}
.col[data-col="sydney"] .col-h h2{color:var(--sydney);}
.col-body{flex:1;min-width:0;max-width:100%;padding:10px;display:flex;flex-direction:column;gap:8px;}
.empty{color:var(--muted);font-size:13px;padding:18px 8px;text-align:center;font-family:var(--serif);font-style:italic;}

.card{min-width:0;max-width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 12px 10px;box-shadow:0 1px 0 rgba(255,255,255,.02);-webkit-touch-callout:none;}
.card:hover{background:var(--card-hover);}
.card.dragging{opacity:.45;}
.card.touch-dragging{opacity:.22;}
.card.drop-before{box-shadow:0 -3px 0 var(--brass);}
.touch-drag-ghost{position:fixed;z-index:60;pointer-events:none;margin:0;opacity:.96;transform:scale(1.02);box-shadow:0 18px 50px rgba(0,0,0,.48);user-select:none;-webkit-user-select:none;}
body.touch-sorting{user-select:none;-webkit-user-select:none;}
.card-top{display:flex;min-width:0;max-width:100%;align-items:flex-start;gap:8px;}
.chk{width:16px;height:16px;margin-top:3px;accent-color:var(--brass);flex-shrink:0;}
.title{flex:1;min-width:0;max-width:100%;overflow-wrap:anywhere;font-weight:600;font-size:14.5px;line-height:1.35;}
.snippet{min-width:0;max-width:calc(100% - 24px);overflow-wrap:anywhere;margin:6px 0 0 24px;color:var(--soft);font-size:13px;white-space:pre-wrap;}
.meta{display:flex;min-width:0;max-width:calc(100% - 24px);flex-wrap:wrap;gap:6px;margin:10px 0 0 24px;align-items:center;}
.tag{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;border-radius:999px;padding:2px 7px;border:1px solid var(--line-strong);color:var(--soft);}
.tag.studio-pod{color:#d8c4a0;border-color:rgba(196,165,116,.35);}
.tag.cbp{color:#b7c6d2;border-color:rgba(143,163,176,.4);}
.tag.personal{color:#c9c2b4;border-color:var(--line-strong);}
.tag.unfiled{color:#b0aaa0;border-color:rgba(176,170,160,.28);}
.duechip{font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;font-weight:700;border-radius:999px;padding:2px 7px;background:rgba(255,255,255,.04);color:var(--muted);}
.duechip.soon{color:var(--soon);background:rgba(212,176,106,.12);}
.duechip.over{color:#fff;background:var(--over);}
.src{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
.ctrls{display:flex;min-width:0;max-width:calc(100% - 24px);flex-wrap:wrap;gap:6px;margin:10px 0 0 24px;}
.ctrls select,.ctrls input[type="date"]{min-width:0;max-width:100%;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:4px 6px;font-size:11.5px;color:var(--soft);}
.note-toggle{background:none;border:none;color:var(--muted);font-size:12px;padding:0;margin-left:auto;}
.note-toggle:hover{color:var(--ink);}
.noteta{display:block;width:calc(100% - 24px);max-width:calc(100% - 24px);margin:8px 0 0 24px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13px;resize:vertical;min-height:56px;}
.noteta:focus{outline:none;border-color:var(--brass);}

.drawer-back{position:fixed;inset:0;background:rgba(0,0,0,.46);z-index:40;}

<body>
<div id="boot">Opening the board…</div>

<div id="login">
  <div class="login-card">
    <div class="login-kicker">Chris &amp; Sydney</div>
    <h1>Ops</h1>
    <p>The shared board. Sign in with the same Studio Pod account you already use.</p>
    <label for="loginEmail">Email</label>
    <input id="loginEmail" type="email" placeholder="you@work.com" autocomplete="email">
    <label for="loginPassword">Password</label>
    <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password">
    <button class="btn" id="loginBtn" style="width:100%">Sign in</button>
    <button class="linkish" id="magicBtn">Email me a login link instead</button>
    <div class="login-msg" id="loginMsg"></div>
    <div class="login-foot">
      <a href="index.html">← Morning dashboard</a>
      <div class="install-hint">On iPhone: Safari → Share → Add to Home Screen</div>
    </div>
  </div>
</div>

<div id="app">
  <div class="top">
    <div class="mast">
      <div class="brand">
        <div class="kicker">Shared board</div>
        <h1>Ops <em>for the week</em></h1>
        <div class="navlinks">
          <a href="index.html">Morning dashboard</a>
          <a class="here" href="ops.html">Ops</a>
        </div>
      </div>
      <div class="mast-right">
        <div class="clock">
          <div class="time" id="time">--:--</div>
          <div class="date" id="date"></div>
        </div>
        <div class="who">
          <span id="userLabel">Signed in</span>
          <div class="alert-wrap">
            <button type="button" class="alert-btn" id="alertBtn" aria-label="Alerts" aria-controls="alertPanel" aria-expanded="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>

    <div class="viewbar">

        <button type="button" data-actor="emails">Emails</button>

        <button class="chip" data-email-project="cbp">CBP</button>
        <button class="chip" data-email-project="studio-pod">Studio Pod</button>
        <button class="chip" data-email-project="personal">Personal</button>

    </div>
  </div>

  <div class="board" id="board"></div>
  <div class="below-board">
    <div class="toolbar">
      <button class="btn tiny ghost" id="msImport">Import To Do</button>
      <button class="btn tiny ghost" id="doneBtn">Done <span id="doneCount">0</span></button>
    </div>

      <button class="chip on" data-project="">All projects</button>
      <button class="chip" data-project="studio-pod">Studio Pod</button>
      <button class="chip" data-project="cbp">CBP</button>

  <div class="composer" role="region" aria-label="Add a card">

      <div class="composer-confirm" id="composerConfirm" aria-live="polite"></div>
      <div class="composer-row">
        <button type="button" class="mic-btn" id="micBtn" title="Dictate" aria-label="Dictate">🎙</button>
        <input id="composerInput" type="text" inputmode="text" enterkeyhint="send" autocomplete="off" placeholder="Tell Ops what to add…">
        <button type="button" class="send-btn" id="sendBtn" title="Add card" aria-label="Add card">↑</button>
      </div>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const SB_URL = "https://daddiljpnhfuxcdqsulg.supabase.co";
const SB_KEY = "sb_publishable_kklnADdWDTkXsJyjx9FMiA_gNbKjm7H";
const sb = (window.supabase && supabase.createClient)
  ? supabase.createClient(SB_URL, SB_KEY)
  : null;

const MS_CLIENT_ID = "6317e330-50ac-46f2-89c3-dc661be621f4";
const MS_REDIRECT = "https://cbsp4809.github.io/personal-dashboard/";
const MS_LIVE = /github\.io\/personal-dashboard/i.test(location.href);

const COLUMNS = [
  { key:"needs-you", label:"Needs you", sub:"Waiting on Chris" },
  { key:"today", label:"Today", sub:"" },
  { key:"this-week", label:"This week", sub:"Parked for the next few days" },
  { key:"later", label:"Later", sub:"The long list — not today, not this week" },
  { key:"sydney", label:"Sydney owns", sub:"She writes these and can finish them" }
];
const PROJECTS = { "studio-pod":"Studio Pod", cbp:"CBP", personal:"Personal", unfiled:"Unfiled" };
const OWNERS = { chris:"Chris", sydney:"Sydney" };
const SOURCES = { chat:"chat", email:"email", todo:"To Do", calendar:"calendar" };

let currentUser = null;
let actor = localStorage.getItem("ops_actor") || "chris";
if(!["chris","sydney","emails"].includes(actor)) actor = "chris";
let cards = [];
let projectFilter = "";
let emailProjectFilter = "";
let drawerOpen = false;
let dragId = null;
let savingOrder = false;
let touchDrag = null;
let touchScrollFrame = 0;
let suppressTouchClickUntil = 0;
let alerts = [];
let alertsInitialized = false;
let alertsAvailable = true;
let alertChannel = null;
let alertPollTimer = 0;
let alertRealtimeTimer = 0;
let alertPanelOpen = false;
let serviceWorkerRegistration = null;
const knownAlertIds = new Set();

const TOUCH_HOLD_MS = 450;
const TOUCH_CANCEL_DISTANCE = 10;
const TOUCH_CONTROL_SELECTOR = "button,input,select,textarea,a,label";

function setStatus(msg, err){
  const el = $("#status");
  el.textContent = msg || "";
  el.className = "status" + (err ? " err" : "");
}
function isoNow(){ return new Date().toISOString(); }
function todayISO(){
  const n = new Date();
  return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0");
}
function startOfWeek(d){
  const x = new Date(d); x.setHours(0,0,0,0);
  const day = x.getDay(); x.setDate(x.getDate() - day);
  return x;
}
function fmtDue(d){
  if(!d) return "";
  return new Date(d+"T00:00").toLocaleDateString([], { month:"short", day:"numeric" });
}
function dueClass(d){
  if(!d) return "";
  const t = new Date(); t.setHours(0,0,0,0);
  const diff = (new Date(d+"T00:00") - t) / 86400000;
  if(diff < 0) return "over";
  if(diff <= 1) return "soon";
  return "";
}
function openCards(){ return cards.filter(c => !c.done_at); }
function doneCards(){ return cards.filter(c => c.done_at).sort((a,b)=> String(b.done_at).localeCompare(String(a.done_at))); }

function tick(){
  const n = new Date();
  $("#time").textContent = n.toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" });
  $("#date").textContent = n.toLocaleDateString([], { weekday:"long", month:"long", day:"numeric" });
  const todayCol = COLUMNS.find(c => c.key==="today");
  if(todayCol) todayCol.sub = n.toLocaleDateString([], { weekday:"long", month:"short", day:"numeric" }) + " · daily focus";
}
setInterval(tick, 30000);

function showLogin(){
  $("#boot").classList.add("hidden");
  $("#app").style.display = "none";
  $("#login").style.display = "flex";
}
function showApp(){
  $("#boot").classList.add("hidden");
  $("#login").style.display = "none";
  $("#app").style.display = "block";
  $("#userLabel").textContent = currentUser && currentUser.email ? currentUser.email : "Signed in";
  syncActorUI();
  tick();
  renderBoard();
}

function unreadAlertCount(){
  return alerts.filter(alert => !alert.read_at).length;
}

function alertTime(value){
  if(!value) return "";
  const date = new Date(value);
  if(Number.isNaN(date.getTime())) return "";
  return date.toLocaleString([], { month:"short", day:"numeric", hour:"numeric", minute:"2-digit" });
}

function notificationFootText(){
  if(!("Notification" in window)) return "System notifications are not available in this app.";
  if(Notification.permission==="granted") return "System notifications are on while Ops is open.";
  if(Notification.permission==="denied") return "System notifications are blocked in device settings.";
  return "Opening Alerts once asks this device for notification permission.";
}

function syncAppBadge(count){
  try{
    if(count>0 && typeof navigator.setAppBadge==="function"){
      Promise.resolve(navigator.setAppBadge(count)).catch(()=>{});
    }else if(count===0 && typeof navigator.clearAppBadge==="function"){
      Promise.resolve(navigator.clearAppBadge()).catch(()=>{});
    }
  }catch(_){}
}

function renderAlerts(){
  const unread = unreadAlertCount();
  const badge = $("#alertBadge");
  badge.textContent = unread>99 ? "99+" : String(unread);
  badge.classList.toggle("hidden", unread===0);
  $("#alertBtn").setAttribute("aria-label", unread ? `Alerts, ${unread} unread` : "Alerts, none unread");
  $("#alertMarkAll").disabled = unread===0 || !alertsAvailable;
  syncAppBadge(unread);

  const list = $("#alertList");
  if(!alertsAvailable){
    list.innerHTML = `<div class="alert-empty">Alerts need the database setup in sql/ops_alerts.sql.</div>`;
  }else if(!alerts.length){
    list.innerHTML = `<div class="alert-empty">No alerts yet.</div>`;
  }else{
    list.innerHTML = alerts.map(alert => `<button type="button" class="alert-item${alert.read_at?"":" unread"}" data-alert-id="${esc(alert.id)}">
      <span class="alert-item-title">${esc(alert.title)}</span>
      <span class="alert-item-body">${esc(alert.body||"")}</span>
      <span class="alert-item-time">${esc(alertTime(alert.created_at))}</span>
    </button>`).join("");
    list.querySelectorAll("[data-alert-id]").forEach(button => {
      button.onclick = () => openAlert(button.dataset.alertId);
    });
  }
  $("#alertFoot").textContent = notificationFootText();
}

function openAlertPanel(){
  alertPanelOpen = true;
  $("#alertBtn").setAttribute("aria-expanded", "true");
  $("#alertPanel").classList.remove("hidden");
  $("#alertBack").classList.remove("hidden");
  renderAlerts();
}

function closeAlertPanel(){
  alertPanelOpen = false;
  $("#alertBtn").setAttribute("aria-expanded", "false");
  $("#alertPanel").classList.add("hidden");
  $("#alertBack").classList.add("hidden");
}

async function requestNotificationPermissionOnce(){
  if(!("Notification" in window) || Notification.permission!=="default") return;
  if(localStorage.getItem("ops_notification_prompted")==="1") return;
  localStorage.setItem("ops_notification_prompted", "1");
  try{
    await Notification.requestPermission();
  }catch(_){}
  renderAlerts();
}

function safeAlertUrl(href){
  if(!href) return "";
  try{
    const url = new URL(href, location.href);
    return url.origin===location.origin ? url.href : "";
  }catch(_){
    return "";
  }
}

async function showSystemNotification(alert){
  if(!alert || alert.read_at || !("Notification" in window) || Notification.permission!=="granted") return;
  const target = safeAlertUrl(alert.href) || new URL("ops.html", location.href).href;
  const options = {
    body: alert.body || "",
    icon: "icons/icon-192.png",
    badge: "icons/favicon-32.png",
    tag: "ops-alert-"+alert.id,
    data: { url:target }
  };
  try{
    if(serviceWorkerRegistration && serviceWorkerRegistration.showNotification){
      await serviceWorkerRegistration.showNotification(alert.title, options);
    }else{
      const notification = new Notification(alert.title, options);
      notification.onclick = () => {
        window.focus();
        if(target) location.href = target;
        notification.close();
      };
    }
  }catch(_){}
}

function applyAlertRow(row, notify){
  if(!row || !row.id) return;
  const isNew = !knownAlertIds.has(row.id);
  knownAlertIds.add(row.id);
  const index = alerts.findIndex(alert => alert.id===row.id);
  if(index>=0) alerts[index] = row;
  else alerts.push(row);
  alerts.sort((a,b) => String(b.created_at||"").localeCompare(String(a.created_at||"")));
  alerts = alerts.slice(0, 50);
  renderAlerts();
  if(notify && isNew && !row.read_at) showSystemNotification(row);
}

async function loadAlerts(options){
  if(!sb || !currentUser) return;
  const notifyNew = !!(options && options.notifyNew && alertsInitialized);
  const { data, error } = await sb.from("ops_alerts")
    .select("id,title,body,kind,href,card_id,read_at,created_at")
    .order("created_at", { ascending:false })
    .limit(50);
  if(error){
    alertsAvailable = false;
    alerts = [];
    renderAlerts();
    return;
  }
  alertsAvailable = true;
  const rows = data || [];
  if(notifyNew){
    rows.filter(row => !knownAlertIds.has(row.id) && !row.read_at).forEach(showSystemNotification);
  }
  alerts = rows;
  rows.forEach(row => knownAlertIds.add(row.id));
  alertsInitialized = true;
  renderAlerts();
}

function startAlertPolling(){
  if(alertPollTimer) return;
  alertPollTimer = setInterval(() => {
    if(currentUser && !document.hidden) loadAlerts({ notifyNew:true });
  }, 20000);
}

function stopAlertPolling(){
  if(alertPollTimer) clearInterval(alertPollTimer);
  alertPollTimer = 0;
}

function subscribeToAlerts(){
  if(!sb || !currentUser || alertChannel) return;
  startAlertPolling();
  alertChannel = sb.channel("ops-alerts-"+currentUser.id)
    .on("postgres_changes", {
      event:"*",
      schema:"public",
      table:"ops_alerts",
      filter:"user_id=eq."+currentUser.id
    }, payload => {
      if(payload.eventType==="DELETE"){
        loadAlerts();
        return;
      }
      applyAlertRow(payload.new, payload.eventType==="INSERT");
    })
    .subscribe(status => {
      if(status==="SUBSCRIBED"){
        stopAlertPolling();
        clearTimeout(alertRealtimeTimer);
        loadAlerts({ notifyNew:true });
      }else if(status==="CHANNEL_ERROR" || status==="TIMED_OUT" || status==="CLOSED"){
        startAlertPolling();
      }
    });
  alertRealtimeTimer = setTimeout(startAlertPolling, 8000);
}

async function markAlertRead(id){
  const alert = alerts.find(item => item.id===id);
  if(!alert || alert.read_at) return true;
  const previous = alert.read_at;
  alert.read_at = isoNow();
  renderAlerts();
  const { error } = await sb.from("ops_alerts").update({ read_at:alert.read_at }).eq("id", id).is("read_at", null);
  if(error){
    alert.read_at = previous;
    renderAlerts();
    return false;
  }
  return true;
}

async function markAllAlertsRead(){
  const unread = alerts.filter(alert => !alert.read_at);
  if(!unread.length || !sb || !currentUser) return;
  const now = isoNow();
  unread.forEach(alert => { alert.read_at = now; });
  renderAlerts();
  const { error } = await sb.from("ops_alerts")
    .update({ read_at:now })
    .eq("user_id", currentUser.id)
    .is("read_at", null);
  if(error) await loadAlerts();
}

async function openAlert(id){
  const alert = alerts.find(item => item.id===id);
  if(!alert) return;
  await markAlertRead(id);
  const target = safeAlertUrl(alert.href);
  if(target){
    location.href = target;
    return;
  }
  closeAlertPanel();
  if(!alert.card_id) return;
  const card = cards.find(item => item.id===alert.card_id);
  if(!card) return;
  actor = isEmailCard(card) ? "emails" : (card.owner==="sydney" ? "sydney" : "chris");
  localStorage.setItem("ops_actor", actor);
  syncActorUI();
  renderBoard();
  const cardElement = document.querySelector(`[data-id="${CSS.escape(card.id)}"]`);
  if(cardElement) cardElement.scrollIntoView({ behavior:"smooth", block:"center" });
}

async function createOpsAlert(fields){
  if(!sb || !currentUser || !fields || !fields.title) return null;
  const { data, error } = await sb.from("ops_alerts").insert({
    title: fields.title,
    body: fields.body || "",
    kind: fields.kind || "general",
    href: fields.href || null,
    card_id: fields.card_id || null
  }).select("id,title,body,kind,href,card_id,read_at,created_at").single();
  if(error){
    setStatus("Card saved. Could not create alert: "+error.message, true);
    return null;
  }
  applyAlertRow(data, false);
  return data;
}

async function createAlertForCard(card){
  if(!card) return;
  if(isEmailCard(card)){
    await createOpsAlert({ title:"New email reply", body:card.title, kind:"email", card_id:card.id });
  }else if(card.column_key==="needs-you"){
    await createOpsAlert({ title:"Needs you", body:card.title, kind:"needs-you", card_id:card.id });
  }
}

async function registerServiceWorker(){
  if(!("serviceWorker" in navigator) || !window.isSecureContext) return;
  try{
    serviceWorkerRegistration = await navigator.serviceWorker.register("sw.js", { scope:"./" });
  }catch(_){}
}

function syncActorUI(){
  $$(".actor button").forEach(b => b.classList.toggle("on", b.dataset.actor===actor));
  const showingEmails = actor==="emails";
  $("#emailFilters").classList.toggle("hidden", !showingEmails);
  $("#projectFilters").classList.toggle("hidden", showingEmails);
  $("#msImport").classList.toggle("hidden", showingEmails);
  $(".viewbar-label").textContent = showingEmails ? "View" : "Whose board?";
  const input = $("#composerInput");
  if(input) input.placeholder = actor==="sydney"
    ? "Tell Ops what Sydney should pick up…"
    : "Tell Ops what to add…";
}

$$(".actor button").forEach(b => b.onclick = () => {
  actor = b.dataset.actor;
  localStorage.setItem("ops_actor", actor);
  syncActorUI();
  renderBoard();
});

function redirectTo(){
  return location.href.split("#")[0];
}

async function sendMagicLink(){
  const email = $("#loginEmail").value.trim();
  const msg = $("#loginMsg");
  if(!email){ msg.textContent = "Enter your email first."; return; }
  if(!sb){ msg.textContent = "Supabase failed to load. Refresh and try again."; return; }
  msg.textContent = "Sending…";
  const { error } = await sb.auth.signInWithOtp({ email, options:{ emailRedirectTo: redirectTo() } });
  msg.textContent = error ? ("Error: "+error.message) : "Check your email for the login link. If it does not open this page, use your password instead.";
}
async function signInPassword(){
  const email = $("#loginEmail").value.trim();
  const password = $("#loginPassword").value;
  const msg = $("#loginMsg");
  if(!email || !password){ msg.textContent = "Enter your email and password."; return; }
  if(!sb){ msg.textContent = "Supabase failed to load. Refresh and try again."; return; }
  msg.textContent = "Signing in…";
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error) msg.textContent = error.message + " — no password yet? Use the link option below, then set one on Studio Pod.";
}
async function signOut(){
  if(alertChannel && sb) await sb.removeChannel(alertChannel);
  stopAlertPolling();
  syncAppBadge(0);
  if(sb) await sb.auth.signOut();
  currentUser = null;
  location.reload();
}

async function onSignedIn(session){
  currentUser = { email: session.user.email, id: session.user.id };
  showApp();
  await loadCards();
  await loadAlerts();
  subscribeToAlerts();
}

async function loadCards(){
  if(savingOrder || (touchDrag && touchDrag.active)) return;
  if(!sb){ setStatus("Supabase client missing.", true); return; }
  const { data, error } = await sb.from("ops_cards")
    .select("id,title,snippet,project,column_key,owner,due_on,source,source_ref,sort,done_at,done_by,created_at,updated_at")
    .order("sort", { ascending:true })
    .order("created_at", { ascending:true });
  if(error){ setStatus("Could not load cards: "+error.message, true); return; }
  cards = data || [];
  setStatus(openCards().length ? "" : "Board is empty. Add a card, or import from Microsoft To Do.");
  renderBoard();
  if(drawerOpen) renderDrawer();
}

function visible(card){
  return !projectFilter || card.project===projectFilter;
}

function compareCards(a, b){
  return (Number(a.sort)||0) - (Number(b.sort)||0)
    || String(a.created_at).localeCompare(String(b.created_at))
    || String(a.id).localeCompare(String(b.id));
}

function projectKey(value){
  const key = String(value||"").trim().toLowerCase().replace(/[\s_]+/g, "-");
  if(key==="studiopod") return "studio-pod";
  return key;
}

function isEmailCard(card){
  return String(card.source||"").trim().toLowerCase()==="email";
}

function compareEmailPriority(a, b){
  const dueA = a.due_on || "9999-12-31";
  const dueB = b.due_on || "9999-12-31";
  return String(dueA).localeCompare(String(dueB)) || compareCards(a, b);
}

function emailUrgency(card){
  if(!card.due_on){
    const col = COLUMNS.find(c => c.key===card.column_key);
    return col ? col.label : "Queued";
  }
  const today = new Date(); today.setHours(0,0,0,0);
  const due = new Date(card.due_on+"T00:00");
  const diff = Math.round((due-today)/86400000);
  if(diff<0) return "Overdue";
  if(diff===0) return "Due today";
  if(diff===1) return "Due tomorrow";
  return "Due "+fmtDue(card.due_on);
}

function cardsInColumn(columnKey, exceptId){
  return openCards()

function touchPoint(list, identifier){
  return [...list].find(touch => touch.identifier===identifier) || null;
}

function clearDropMarkers(){
  $$(".col.over").forEach(col => col.classList.remove("over"));
  $$(".card.drop-before").forEach(card => card.classList.remove("drop-before"));
}

function beginTouchHold(e){
  if(savingOrder || touchDrag || e.touches.length!==1 || e.target.closest(TOUCH_CONTROL_SELECTOR)) return;
  const touch = e.changedTouches[0];
  const el = e.currentTarget;
  touchDrag = {
    id: el.dataset.id,
    identifier: touch.identifier,
    el,
    startX: touch.clientX,
    startY: touch.clientY,
    x: touch.clientX,
    y: touch.clientY,
    active: false,
    timer: 0,
    ghost: null,
    offsetY: 0,
    targetColumn: null,
    beforeId: null,
    scrollSpeed: 0
  };
  touchDrag.timer = setTimeout(activateTouchDrag, TOUCH_HOLD_MS);
}

function activateTouchDrag(){
  const state = touchDrag;
  if(!state || state.active || !state.el.isConnected) return;
  state.active = true;
  const rect = state.el.getBoundingClientRect();
  const ghost = state.el.cloneNode(true);
  ghost.className = "card touch-drag-ghost";
  ghost.removeAttribute("data-id");
  ghost.removeAttribute("draggable");
  ghost.setAttribute("aria-hidden", "true");
  Object.assign(ghost.style, {
    width:rect.width+"px",
    height:rect.height+"px",
    left:rect.left+"px",
    top:rect.top+"px"
  });
  state.ghost = ghost;
  state.offsetY = state.y - rect.top;
  state.el.classList.add("touch-dragging");
  document.body.classList.add("touch-sorting");
  document.body.appendChild(ghost);
  const selection = window.getSelection && window.getSelection();
  if(selection) selection.removeAllRanges();
  if(navigator.vibrate) navigator.vibrate(18);
  moveTouchGhost();
  updateTouchDropTarget();
}

function moveTouchGhost(){
  if(!touchDrag || !touchDrag.active || !touchDrag.ghost) return;
  const top = Math.max(4, Math.min(innerHeight - touchDrag.ghost.offsetHeight - 4, touchDrag.y - touchDrag.offsetY));
  touchDrag.ghost.style.top = top+"px";
}

function touchColumnBodyAt(x, y){
  const hit = document.elementFromPoint(x, y);
  if(!hit) return null;
  const direct = hit.closest(".col-body");
  if(direct) return direct;
  const column = hit.closest(".col");
  return column ? column.querySelector(".col-body") : null;
}

function updateTouchDropTarget(){
  const state = touchDrag;
  if(!state || !state.active) return;
  clearDropMarkers();
  state.targetColumn = null;
  state.beforeId = null;
  const body = touchColumnBodyAt(state.x, state.y);
  if(!body) return;
  const column = body.closest(".col");
  const anchor = [...body.querySelectorAll(".card:not(.touch-dragging)")]
    .find(card => state.y < card.getBoundingClientRect().top + card.getBoundingClientRect().height / 2);
  column.classList.add("over");
  if(anchor) anchor.classList.add("drop-before");
  state.targetColumn = column.dataset.col;
  state.beforeId = anchor ? anchor.dataset.id : null;
}

function runTouchAutoScroll(){
  touchScrollFrame = 0;
  const state = touchDrag;
  if(!state || !state.active || !state.scrollSpeed) return;
  window.scrollBy(0, state.scrollSpeed);
  updateTouchDropTarget();
  touchScrollFrame = requestAnimationFrame(runTouchAutoScroll);
}

function updateTouchAutoScroll(){
  const state = touchDrag;
  if(!state || !state.active) return;
  const edge = 88;
  const bottomEdge = innerHeight - 112;
  state.scrollSpeed = state.y < edge
    ? -Math.ceil((edge - state.y) / 5)
    : state.y > bottomEdge
      ? Math.ceil((state.y - bottomEdge) / 5)
      : 0;
  state.scrollSpeed = Math.max(-18, Math.min(18, state.scrollSpeed));
  if(state.scrollSpeed && !touchScrollFrame) touchScrollFrame = requestAnimationFrame(runTouchAutoScroll);
  if(!state.scrollSpeed && touchScrollFrame){
    cancelAnimationFrame(touchScrollFrame);
    touchScrollFrame = 0;
  }
}

function cancelTouchDrag(){
  const state = touchDrag;
  if(!state) return;
  clearTimeout(state.timer);
  if(touchScrollFrame) cancelAnimationFrame(touchScrollFrame);
  touchScrollFrame = 0;
  if(state.el) state.el.classList.remove("touch-dragging");
  if(state.ghost) state.ghost.remove();
  document.body.classList.remove("touch-sorting");
  clearDropMarkers();
  touchDrag = null;
}

function onTouchMove(e){
  const state = touchDrag;
  if(!state) return;
  const touch = touchPoint(e.touches, state.identifier);
  if(!touch) return;
  state.x = touch.clientX;
  state.y = touch.clientY;
  if(!state.active){
    if(Math.hypot(state.x-state.startX, state.y-state.startY) > TOUCH_CANCEL_DISTANCE) cancelTouchDrag();
    return;
  }
  e.preventDefault();
  moveTouchGhost();
  updateTouchDropTarget();
  updateTouchAutoScroll();
}

function onTouchEnd(e){
  const state = touchDrag;
  if(!state || !touchPoint(e.changedTouches, state.identifier)) return;
  if(!state.active){
    cancelTouchDrag();
    return;
  }
  e.preventDefault();
  const id = state.id;
  const column = state.targetColumn;
  const beforeId = state.beforeId;
  suppressTouchClickUntil = Date.now()+500;
  cancelTouchDrag();
  if(column) reorderCard(id, column, beforeId);
}

document.addEventListener("touchmove", onTouchMove, { passive:false });
document.addEventListener("touchend", onTouchEnd, { passive:false });
document.addEventListener("touchcancel", cancelTouchDrag, { passive:true });
document.addEventListener("click", e => {
  if(Date.now() < suppressTouchClickUntil){
    e.preventDefault();
    e.stopPropagation();
  }
}, true);

function bindBoard(){
  $$(".col").forEach(col => {
    const body = col.querySelector(".col-body");
    body.ondragover = e => {
      e.preventDefault();
      col.classList.add("over");
      $$(".card.drop-before").forEach(card => card.classList.remove("drop-before"));
      const anchor = [...body.querySelectorAll(".card:not(.dragging)")]
        .find(card => e.clientY < card.getBoundingClientRect().top + card.getBoundingClientRect().height / 2);
      if(anchor) anchor.classList.add("drop-before");
    };
    body.ondragleave = e => {
      if(body.contains(e.relatedTarget)) return;
      col.classList.remove("over");
      $$(".card.drop-before").forEach(card => card.classList.remove("drop-before"));
    };
    body.ondrop = async e => {
      e.preventDefault();
      const anchor = body.querySelector(".card.drop-before");
      col.classList.remove("over");
      $$(".card.drop-before").forEach(card => card.classList.remove("drop-before"));
      if(!dragId) return;
      await reorderCard(dragId, col.dataset.col, anchor ? anchor.dataset.id : null);
    };
  });
  $$(".card").forEach(el => {
    const id = el.dataset.id;
    const card = cards.find(c => c.id===id);
    if(!card) return;
    el.ondragstart = e => {
      dragId = id;
      el.classList.add("dragging");
      if(e.dataTransfer){
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", id);
      }
    };
    el.ondragend = () => {
      dragId = null;
      el.classList.remove("dragging");
      $$(".col.over").forEach(col => col.classList.remove("over"));
      $$(".card.drop-before").forEach(card => card.classList.remove("drop-before"));
    };
    el.querySelector(".chk").onchange = e => completeCard(card, e.target);
    const star = el.querySelector(".card-star");
    star.onpointerdown = e => e.stopPropagation();
    star.onclick = e => { e.preventDefault(); e.stopPropagation(); toggleNeedsYou(card); };
    el.addEventListener("touchstart", beginTouchHold, { passive:true });
    el.oncontextmenu = e => {
      if(touchDrag && touchDrag.el===el) e.preventDefault();
    };
    el.querySelector(".proj").onchange = e => patchCard(id, { project:e.target.value });
    el.querySelector(".own").onchange = e => patchCard(id, { owner:e.target.value });
    el.querySelector(".colsel").onchange = e => moveCard(id, e.target.value);
    el.querySelector(".due").onchange = e => patchCard(id, { due_on: e.target.value || null });
    const note = el.querySelector(".noteta");
    el.querySelector(".note-toggle").onclick = () => {
      note.classList.toggle("hidden");
      if(!note.classList.contains("hidden")) note.focus();
    };
    note.onblur = () => {
      const v = note.value.trim();
      if(v !== (card.snippet||"")) patchCard(id, { snippet:v });
    };
  });
}

async function copyText(text){
  if(navigator.clipboard && window.isSecureContext){
    await navigator.clipboard.writeText(text);
    return;
  }
  const area = document.createElement("textarea");
  area.value = text;
  area.setAttribute("readonly", "");
  area.style.position = "fixed";
  area.style.opacity = "0";
  document.body.appendChild(area);
  area.select();
  area.setSelectionRange(0, area.value.length);
  const copied = document.execCommand("copy");
  area.remove();
  if(!copied) throw new Error("Copy is not available");
}

function bindEmailCards(){

      }
    };
  });
}

async function patchCard(id, fields){
  if(!sb) return false;
  const payload = Object.assign({ updated_at: isoNow() }, fields);
  const { error } = await sb.from("ops_cards").update(payload).eq("id", id);
  if(error){ setStatus("Update failed: "+error.message, true); return false; }
  const i = cards.findIndex(c => c.id===id);
  if(i>=0) cards[i] = Object.assign({}, cards[i], payload);
  renderBoard();
  return true;
}

async function reorderCard(id, column_key, beforeId){
  const card = cards.find(c => c.id===id);
  if(!card || savingOrder) return;

  const sourceColumn = card.column_key;
  const destination = cardsInColumn(column_key, id);
  let insertAt = beforeId ? destination.findIndex(c => c.id===beforeId) : destination.length;
  if(insertAt<0) insertAt = destination.length;
  destination.splice(insertAt, 0, card);

  const source = sourceColumn===column_key ? [] : cardsInColumn(sourceColumn, id);
  const stacks = sourceColumn===column_key ? [destination] : [source, destination];
  const originalOrder = cardsInColumn(sourceColumn).map(c => c.id);
  const nextOrder = sourceColumn===column_key ? destination.map(c => c.id) : [];
  if(sourceColumn===column_key && originalOrder.every((cardId, index) => cardId===nextOrder[index])) return;

  const snapshot = cards.map(c => Object.assign({}, c));
  const now = isoNow();
  const updates = [];
  stacks.forEach(stack => stack.forEach((item, sort) => {
    const fields = { sort, updated_at:now };
    if(item.id===id && sourceColumn!==column_key){
      fields.column_key = column_key;
      if(column_key==="sydney") fields.owner = "sydney";
      if(column_key==="needs-you") fields.owner = "chris";
    }
    if(Number(item.sort)!==sort || fields.column_key || fields.owner) updates.push({ id:item.id, fields });
    Object.assign(item, fields);
  }));

  savingOrder = true;
  renderBoard();
  const results = await Promise.all(updates.map(update =>
    sb.from("ops_cards").update(update.fields).eq("id", update.id)
  ));
  const failed = results.find(result => result.error);
  savingOrder = false;
  if(failed){
    cards = snapshot;
    renderBoard();
    setStatus("Could not save card order: "+failed.error.message, true);
    return;
  }
  setStatus("Order saved.");
  if(sourceColumn!=="sydney" && column_key==="sydney"){
    await notifySydneyOwns(cards.find(c => c.id===id));
  }
}

async function moveCard(id, column_key, options){
  const card = cards.find(c => c.id===id);
  if(!card || card.column_key===column_key) return;
  const first = options && options.atTop ? cardsInColumn(column_key)[0] : null;
  await reorderCard(id, column_key, first ? first.id : null);
}

async function toggleNeedsYou(card){
  if(!card) return;
  if(card.column_key==="needs-you") await moveCard(card.id, "today");
  else await moveCard(card.id, "needs-you", { atTop:true });
}

async function notifySydneyOwns(card){
  if(!sb || !card || !card.id || card.column_key!=="sydney") return;
  const { error } = await sb.from("ops_events").insert({
    card_id: card.id,
    event: "moved_to_sydney",
    payload: {
      title: card.title || "",
      snippet: card.snippet || "",
      project: card.project || ""
    }
  });
  if(error) setStatus("Card saved. Could not record Sydney ping: "+error.message, true);
}

async function completeCard(card, checkbox){

  if(saved) setStatus(actor==="emails" ? "Marked responded and moved to Done." : "Moved to Done.");
  else if(checkbox){
    checkbox.disabled = false;
    checkbox.checked = false;
  }
}

async function reopenCard(id){

}

function parseComposer(raw, currentActor){
  let title = String(raw||"").trim();
  if(!title) return null;
  let owner = currentActor==="sydney" ? "sydney" : "chris";
  let project = "unfiled";
  let column_key = currentActor==="sydney" ? "sydney" : "today";

  title = title
    .replace(/^\s*(?:please\s+)?(?:add\s+)?(?:a\s+)?(?:to[\s-]?do|task)\s*:?\s*/i, "")
    .replace(/^\s*(?:please\s+)?add\s*:?\s*/i, "");

  const take = (pattern, apply) => {
    if(pattern.test(title)){
      apply();
      title = title.replace(pattern, " ");
    }
  };

  take(/\bneeds\s+you\b/i, () => { column_key = "needs-you"; owner = "chris"; });
  take(/\bsydney(?:\s+owns)\b/i, () => { column_key = "sydney"; owner = "sydney"; });
  take(/\bthis\s+week\b/i, () => { column_key = "this-week"; });
  take(/\btoday\b/i, () => { column_key = "today"; });
  take(/\blater\b/i, () => { column_key = "later"; });

  take(/\bstudio[\s-]*pod\b/i, () => { project = "studio-pod"; });
  take(/\bcbp\b/i, () => { project = "cbp"; });
  take(/\bpersonal\b/i, () => { project = "personal"; });
  take(/\bunfiled\b/i, () => { project = "unfiled"; });
  take(/\bbusiness\b/i, () => { project = "studio-pod"; });

  take(/\b(?:for\s+|assign(?:ed)?\s+to\s+)?(?:sydney|you)\b/i, () => { owner = "sydney"; });
  take(/\b(?:for\s+|assign(?:ed)?\s+to\s+)?(?:chris|me)\b/i, () => { owner = "chris"; });

  title = title.replace(/\s+([,.;:!?])/g, "$1").replace(/\s{2,}/g, " ").replace(/^[\s,.;:–—-]+|[\s,.;:–—-]+$/g, "");
  if(!title) return null;
  return { title, project, owner, column_key, source:"chat" };
}

function confirmAdded(card){
  const col = COLUMNS.find(c => c.key===card.column_key);
  $("#composerConfirm").textContent = `Added “${card.title}” · ${OWNERS[card.owner]} · ${PROJECTS[card.project]} · ${col ? col.label : card.column_key}`;
}

async function sendComposer(){
  const input = $("#composerInput");
  const parsed = parseComposer(input.value, actor);
  if(!parsed){
    $("#composerConfirm").textContent = "Say what you want Ops to add.";
    input.focus();
    return;
  }
  $("#sendBtn").disabled = true;
  const row = await createCard({
    title: parsed.title,
    snippet: "",
    project: parsed.project,
    column_key: parsed.column_key,
    owner: parsed.owner,
    due_on: null,
    source: parsed.source
  }, { createAlert:true });
  $("#sendBtn").disabled = false;
  if(!row) return;
  input.value = "";
  confirmAdded(row);
  input.focus();
}

async function createCard(fields, options){
  if(!sb){ setStatus("Not signed in.", true); return null; }
  const siblings = openCards().filter(c => c.column_key===fields.column_key);
  const sort = siblings.length ? Math.max(...siblings.map(c => c.sort||0)) + 1 : 0;
  const row = {
    title: fields.title,
    snippet: fields.snippet || "",
    project: fields.project,
    column_key: fields.column_key,
    owner: fields.owner,
    due_on: fields.due_on || null,
    source: fields.source || "chat",
    source_ref: fields.source_ref || null,
    sort,
    done_at: null,
    done_by: null,
    updated_at: isoNow()
  };
  const { data, error } = await sb.from("ops_cards").insert(row).select("*").single();
  if(error){ setStatus("Could not add card: "+error.message, true); return null; }
  cards.push(data);
  setStatus("Added.");
  renderBoard();
  if(data.column_key==="sydney") await notifySydneyOwns(data);
  if(options && options.createAlert) await createAlertForCard(data);
  return data;
}

let speechRecognition = null;
function setupSpeech(){
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const mic = $("#micBtn");
  const input = $("#composerInput");
  if(!SpeechRecognition){
    mic.title = "Use the keyboard microphone to dictate";
    mic.onclick = () => input.focus();
    return;
  }
  mic.onclick = () => {
    if(speechRecognition){
      speechRecognition.stop();
      return;
    }
    speechRecognition = new SpeechRecognition();
    speechRecognition.lang = "en-US";
    speechRecognition.interimResults = false;
    speechRecognition.maxAlternatives = 1;
    speechRecognition.onstart = () => mic.classList.add("listening");
    speechRecognition.onresult = e => {
      const words = e.results[0][0].transcript.trim();
      input.value = [input.value.trim(), words].filter(Boolean).join(" ");
      input.focus();
    };
    speechRecognition.onerror = () => input.focus();
    speechRecognition.onend = () => {
      mic.classList.remove("listening");
      speechRecognition = null;
    };
    try{ speechRecognition.start(); }
    catch(_){
      mic.classList.remove("listening");
      speechRecognition = null;
      input.focus();
    }
  };
}

function renderDrawer(){
  const items = doneCards();
  let panel = $("#doneDrawer");
  if(!panel){
    const back = document.createElement("div");
    back.className = "drawer-back";
    back.id = "doneBack";
    back.onclick = closeDrawer;
    const d = document.createElement("aside");
    d.className = "drawer";
    d.id = "doneDrawer";
    document.body.appendChild(back);
    document.body.appendChild(d);
    panel = d;
  }
  panel.innerHTML = `<h3>Done</h3><div class="sub">Finished cards leave the board. Restore one if it came back.</div>` +
    (items.length ? items.map(c => `<div class="done-item">
      <div class="t">${esc(c.title)}</div>
      <div class="m">${esc(PROJECTS[c.project]||c.project)} · ${esc(OWNERS[c.done_by]||c.done_by||"")} · ${c.done_at?new Date(c.done_at).toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}):""}</div>
      <button class="btn tiny ghost" data-reopen="${esc(c.id)}" style="margin-top:8px">Restore</button>

}
function openDrawer(){ drawerOpen = true; renderDrawer(); }

}

let msalApp = null;
function initMsal(){
  if(msalApp) return true;
  if(!(window.msal && msal.PublicClientApplication)) return false;
  msalApp = new msal.PublicClientApplication({
    auth:{ clientId:MS_CLIENT_ID, authority:"https://login.microsoftonline.com/common", redirectUri:MS_REDIRECT },
    cache:{ cacheLocation:"localStorage" }
  });
  return true;
}
async function msGraph(path, token){
  const r = await fetch("https://graph.microsoft.com/v1.0"+path, { headers:{ Authorization:"Bearer "+token } });
  if(!r.ok) throw new Error("Graph "+r.status);
  return r.json();
}
function guessProject(name){
  const n = (name||"").toLowerCase();
  if(/studio|pod|franchise|lead|deal|planner/.test(n)) return "studio-pod";
  if(/cbp|photo|wedding|portrait|client|shoot/.test(n)) return "cbp";
  return "personal";
}
function guessColumn(task){
  const due = (task.dueDateTime && task.dueDateTime.dateTime) ? task.dueDateTime.dateTime.slice(0,10) : "";
  if(!due) return "this-week";
  const t = new Date(); t.setHours(0,0,0,0);
  const d = new Date(due+"T00:00");
  const diff = (d - t) / 86400000;
  if(diff < 0) return "needs-you";
  if(diff === 0) return "today";
  if(d <= new Date(startOfWeek(t).getTime() + 7*86400000)) return "this-week";
  return "this-week";
}
function showConnectTodo(detail){
  const wrap = document.createElement("div");
  wrap.className = "modal";
  wrap.innerHTML = `<div class="box"><h3>Connect To Do</h3>
    <div class="msub">Import uses the same Microsoft sign-in already set up on the morning dashboard. It is not a fake sync.</div>
    <div class="connect">${esc(detail)}</div>
    <div class="macts"><button class="btn tiny ghost" id="todoClose">Close</button></div></div>`;
  document.body.appendChild(wrap);
  wrap.querySelector("#todoClose").onclick = () => wrap.remove();
}
async function msImportFlow(){
  if(!MS_CLIENT_ID){
    showConnectTodo("Microsoft To Do is not configured on this site yet.");
    return;
  }
  if(!MS_LIVE){
    showConnectTodo("To Do import is wired, but Microsoft only accepts the live GitHub Pages address. Open the published Ops page, then try Import To Do.");
    return;
  }
  if(!initMsal()){
    showConnectTodo("Microsoft sign-in is still loading. Wait a moment and try again on the live site.");
    return;
  }
  try{
    const login = await msalApp.loginPopup({ scopes:["Tasks.Read"], prompt:"select_account" });
    let tok;
    try{ tok = await msalApp.acquireTokenSilent({ scopes:["Tasks.Read"], account:login.account }); }
    catch(_){ tok = await msalApp.acquireTokenPopup({ scopes:["Tasks.Read"] }); }
    const token = tok.accessToken;
    const lists = await msGraph("/me/todo/lists", token);
    const data = [];
    for(const l of (lists.value||[])){
      const t = await msGraph("/me/todo/lists/"+l.id+"/tasks?$top=100&$filter="+encodeURIComponent("status ne 'completed'"), token);
      data.push({
        name: l.displayName || "List",
        tasks: (t.value||[]).map(x => ({
          title: x.title || "(untitled)",
          snippet: (x.body && x.body.content) ? x.body.content.replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim() : "",
          due: (x.dueDateTime && x.dueDateTime.dateTime) ? x.dueDateTime.dateTime.slice(0,10) : "",
          source_ref: x.id || null,
          column_key: guessColumn(x)
        }))
      });
    }
    showImportPanel(data);
  }catch(e){
    showConnectTodo("Microsoft import could not finish: "+(e && e.message ? e.message : e)+". If the popup was blocked, allow it and try again.");
  }
}
function showImportPanel(data){
  const total = data.reduce((s,l)=>s+l.tasks.length,0);
  const wrap = document.createElement("div");
  wrap.className = "modal";
  wrap.innerHTML = `<div class="box"><h3>Import from Microsoft To Do</h3>
    <div class="msub">${total} open task${total!==1?"s":""} across ${data.length} list${data.length!==1?"s":""}. Choose a project for each list. Due dates decide Today / This week / Needs you.</div>
    <div id="maprows"></div>
    <div class="macts">
      <button class="btn tiny ghost" id="impCancel">Cancel</button>
      <button class="btn tiny" id="impGo">Import</button>
    </div></div>`;
  document.body.appendChild(wrap);
  wrap.querySelector("#maprows").innerHTML = data.map((l,i)=>`<div class="maprow"><div class="mn">${esc(l.name)} <small>${l.tasks.length} open</small></div>
    <select data-i="${i}">
      <option value="studio-pod"${guessProject(l.name)==="studio-pod"?" selected":""}>Studio Pod</option>
      <option value="cbp"${guessProject(l.name)==="cbp"?" selected":""}>CBP</option>
      <option value="personal"${guessProject(l.name)==="personal"?" selected":""}>Personal</option>
      <option value="skip">Skip</option>
    </select></div>`).join("");
  wrap.querySelector("#impCancel").onclick = () => wrap.remove();
  wrap.querySelector("#impGo").onclick = async () => {
    let n = 0, skipped = 0;
    const refs = new Set(cards.map(c => c.source_ref).filter(Boolean));
    for(const s of wrap.querySelectorAll("select")){
      const list = data[+s.dataset.i];
      if(s.value==="skip") continue;
      for(const t of list.tasks){
        if(t.source_ref && refs.has(t.source_ref)){ skipped++; continue; }
        const row = await createCard({
          title: t.title,
          snippet: t.snippet,
          project: s.value,
          column_key: t.column_key,
          owner: "chris",
          due_on: t.due || null,
          source: "todo",
          source_ref: t.source_ref
        });
        if(row){ n++; if(t.source_ref) refs.add(t.source_ref); }
      }
    }
    wrap.remove();
    setStatus("Imported "+n+" task"+(n!==1?"s":"")+(skipped?" · "+skipped+" already on the board":"")+".");
  };
}
$("#msImport").onclick = msImportFlow;

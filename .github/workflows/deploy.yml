name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # The Commodores staff field book is NOT served on this public GitHub
      # Pages site. It is hosted separately on Cloudflare Pages behind
      # Cloudflare Access (coach email login). Strip it from the public artifact.
      - name: Exclude staff field book from the public site
        run: rm -f commodores.html commodores.webmanifest

      # Virginia's Hub is its own Cloudflare Worker (workers.dev), not this
      # public GitHub Pages site. Do not serve the planner from github.io.
      - name: Exclude Virginia's Hub from the public site
        run: rm -rf virginias-hub

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
